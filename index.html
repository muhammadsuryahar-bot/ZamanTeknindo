<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Absensi PT. Zaman Teknindo</title>
    <style>
      /* Password hanya dikelola dari Pengaturan. */
      .admin-sidebar > div:last-child > div:last-child > button:first-child { display: none !important; }
      .admin-sidebar > div:last-child > div:last-child > button:last-child { grid-column: 1 / -1; width: 100%; }

      /* ===== Gaji: hanya berlaku pada halaman payroll Admin ===== */
      .salaryRow { align-items: center !important; gap: 20px !important; padding: 14px 0 !important; }
      .salaryRow > div:first-child { min-width: 230px !important; flex: 1 1 auto !important; }
      .salaryRow .meta { margin-top: 4px !important; color: #6B7482 !important; font-size: 11.5px !important; }
      .salaryAction { width: min(100%, 410px) !important; min-width: 340px !important; display: grid !important; grid-template-columns: minmax(0, 1fr) auto !important; align-items: center !important; gap: 8px !important; }
      .salaryAction .rupiah { min-height: 40px !important; width: 100% !important; border: 1px solid #DADFE6 !important; border-radius: 9px !important; background: #fff !important; overflow: hidden !important; box-shadow: none !important; }
      .salaryAction .rupiah > span { flex: 0 0 auto !important; padding: 0 10px !important; color: #5B6472 !important; font-size: 12px !important; font-weight: 700 !important; border-right: 1px solid #DADFE6 !important; }
      .salaryAction .rupiah input { width: 100% !important; min-width: 0 !important; height: 38px !important; padding: 0 11px !important; border: 0 !important; outline: 0 !important; box-shadow: none !important; background: transparent !important; color: #16233D !important; font-size: 12.5px !important; font-weight: 600 !important; }
      .salaryAction > button { min-height: 40px !important; padding: 0 15px !important; border-radius: 9px !important; white-space: nowrap !important; }

      /* ===== Rekap: toolbar tidak boleh menutupi statistik ===== */
      .admin-rekap-toolbar { top: 78px !important; left: calc(240px + 24px) !important; right: 24px !important; min-height: 64px !important; padding: 10px 12px !important; gap: 18px !important; border: 1px solid #DADFE6 !important; border-radius: 14px !important; background: rgba(255,255,255,0.98) !important; box-shadow: 0 8px 24px rgba(22,35,61,0.08) !important; backdrop-filter: blur(14px) !important; }
      .admin-rekap-toolbar .admin-rekap-date-copy { min-width: 210px !important; display: grid !important; gap: 2px !important; align-content: center !important; }
      .admin-rekap-toolbar .admin-rekap-eyebrow { color: #0B6E45 !important; font-size: 9.5px !important; font-weight: 800 !important; letter-spacing: .08em !important; }
      .admin-rekap-toolbar .admin-rekap-date { color: #16233D !important; font-size: 13px !important; font-weight: 750 !important; line-height: 1.35 !important; }
      .admin-rekap-toolbar .admin-rekap-controls { display: flex !important; align-items: flex-end !important; gap: 7px !important; flex-wrap: wrap !important; }
      .admin-rekap-toolbar .admin-rekap-input { min-height: 36px !important; min-width: 148px !important; padding: 6px 9px !important; border: 1px solid #DADFE6 !important; border-radius: 9px !important; background: #fff !important; color: #16233D !important; font-size: 11.5px !important; font-weight: 650 !important; box-shadow: none !important; }
      .admin-rekap-toolbar .admin-rekap-button,
      .admin-rekap-toolbar .admin-rekap-today { min-height: 36px !important; padding: 7px 11px !important; border-radius: 9px !important; font-size: 10.8px !important; font-weight: 750 !important; white-space: nowrap !important; }
      .admin-rekap-toolbar .admin-rekap-today { border: 0 !important; background: #0B6E45 !important; color: #fff !important; }
      .admin-rekap-toolbar .admin-rekap-button { border: 1px solid #DADFE6 !important; background: #EDEFF3 !important; color: #16233D !important; }
      .admin-rekap-toolbar .admin-rekap-button:hover { background: #E1F0E8 !important; border-color: #0B6E45 !important; }
      .admin-rekap-toolbar + * { min-width: 0; }
      .main-area-admin:has(.statGrid) .statGrid { padding-top: 66px !important; }
      .admin-belum-panel { top: 150px !important; right: 24px !important; width: min(560px, calc(100vw - 48px)) !important; border-radius: 14px !important; }

      /* Settings lama tidak boleh mengulang menu Kantor & Homebase. */
      .main-area-admin section:has(.optionRow) > .card:nth-of-type(3) { display: none !important; }

      /* ===== Kantor & Homebase ===== */
      .main-area-admin .metaGrid { align-items: start !important; }
      .main-area-admin .metaGrid > div { min-width: 0 !important; display: flex !important; flex-direction: column !important; gap: 3px !important; }
      .main-area-admin .metaGrid > div > strong { display: block !important; font-size: 12px !important; line-height: 1.4 !important; color: #16233D !important; }
      .main-area-admin .metaGrid > div > .muted { font-size: 10.5px !important; line-height: 1.35 !important; }
      .main-area-admin .cardGrid { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)) !important; gap: 12px !important; }
      .main-area-admin .cardGrid .card { min-width: 0 !important; }
      .main-area-admin .cardGrid .cardHead strong { display: block !important; line-height: 1.35 !important; }
      .main-area-admin .cardGrid .cardHead .statusBadge { flex-shrink: 0 !important; }

      /* ===== Tabel admin ===== */
      .main-area-admin .tableWrap { overflow: auto !important; -webkit-overflow-scrolling: touch !important; border-radius: 12px !important; }
      .main-area-admin .tableWrap table { border-collapse: separate !important; border-spacing: 0 !important; }
      .main-area-admin .tableWrap th { height: 42px !important; padding: 10px 12px !important; white-space: nowrap !important; vertical-align: middle !important; text-align: left !important; border-bottom: 1px solid #DADFE6 !important; background: #F8F9FB !important; }
      .main-area-admin .tableWrap td { padding: 11px 12px !important; vertical-align: middle !important; border-bottom: 1px solid #E5E8ED !important; }
      .main-area-admin .tableWrap tbody tr:last-child td { border-bottom: 0 !important; }
      .main-area-admin .tableWrap tbody tr:hover td { background: #F8FAF9 !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table { min-width: 1350px !important; table-layout: fixed !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(1) { width: 270px !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(2) { width: 92px !important; text-align: center !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(3) { width: 110px !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(4),
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(5) { width: 92px !important; text-align: center !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(6) { width: 480px !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table th:nth-child(7) { width: 130px !important; text-align: center !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(2),
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(3),
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(4),
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(5),
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(7) { text-align: center !important; }
      .main-area-admin .tableWrap table.zaman-rekap-table td:nth-child(6) { white-space: normal !important; overflow-wrap: anywhere !important; word-break: break-word !important; }
      .main-area-admin .tableWrap table:has(tbody td:last-child button) { min-width: 980px !important; }
      .main-area-admin .tableWrap table:has(tbody td:last-child button):not(.zaman-rekap-table) th:last-child { width: 250px !important; }

      /* Modal Edit Lokasi */
      #zaman-edit-lokasi-modal { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,23,42,.55); box-sizing: border-box; }
      #zaman-edit-lokasi-modal .zaman-edit-lokasi-box { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 24px 70px rgba(0,0,0,.24); }
      #zaman-edit-lokasi-modal textarea { width: 100%; box-sizing: border-box; resize: vertical; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px; font: inherit; font-size: 13px; line-height: 1.5; outline: none; }

      @media (max-width: 760px) {
        .salaryRow { display: grid !important; grid-template-columns: 1fr !important; gap: 10px !important; }
        .salaryRow > div:first-child { min-width: 0 !important; }
        .salaryAction { width: 100% !important; min-width: 0 !important; }
        .admin-rekap-toolbar { top: 72px !important; left: 12px !important; right: 12px !important; min-height: auto !important; padding: 9px !important; flex-direction: column !important; align-items: stretch !important; gap: 8px !important; }
        .admin-rekap-toolbar .admin-rekap-date-copy { min-width: 0 !important; }
        .admin-rekap-toolbar .admin-rekap-controls { display: grid !important; grid-template-columns: minmax(0, 1fr) auto auto !important; align-items: end !important; }
        .admin-rekap-toolbar .admin-rekap-input { min-width: 0 !important; width: 100% !important; }
        .main-area-admin:has(.statGrid) .statGrid { padding-top: 80px !important; }
        .admin-belum-panel { top: 170px !important; right: 12px !important; width: calc(100vw - 24px) !important; max-height: 66dvh !important; }
        .main-area-admin .tableWrap table.zaman-rekap-table { min-width: 1120px !important; }
      }

      @media (max-width: 430px) {
        .salaryAction { grid-template-columns: 1fr !important; }
        .salaryAction > button { width: 100% !important; }
        .admin-rekap-toolbar .admin-rekap-controls { grid-template-columns: 1fr 1fr !important; }
        .admin-rekap-toolbar .admin-rekap-date-field { grid-column: 1 / -1 !important; }
        .admin-rekap-toolbar .admin-rekap-today,
        .admin-rekap-toolbar .admin-rekap-button { width: 100% !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const originalFetch = window.fetch.bind(window);
        let apiBase = '';
        let rekapData = [];

        window.fetch = async (...args) => {
          const input = args[0];
          const url = typeof input === 'string' ? input : input?.url || '';
          if (!apiBase && url.includes('/api/')) apiBase = url.slice(0, url.indexOf('/api/')) + '/api';
          const response = await originalFetch(...args);
          if (/\/api\/admin\/rekap-(hari-ini|tanggal)/.test(url)) {
            try {
              const body = await response.clone().json();
              if (Array.isArray(body?.data)) rekapData = body.data;
            } catch {}
          }
          return response;
        };

        function normalisasiJam(teks) {
          return String(teks || '').replace(/[^0-9]/g, '').slice(0, 4);
        }

        function ambilItemDariBaris(row) {
          const cells = row.querySelectorAll('td');
          if (!cells.length) return null;
          const nama = row.querySelector('td:first-child strong')?.textContent?.trim() || cells[0]?.textContent?.trim() || '';
          const headerCells = row.closest('table')?.querySelectorAll('thead th') || [];
          const headers = [...headerCells].map((th) => (th.textContent || '').trim().toLowerCase());
          const jamIndex = headers.indexOf('masuk');
          const jamMasuk = cells[jamIndex >= 0 ? jamIndex : 3]?.textContent?.trim() || '';
          return rekapData.find((item) => String(item?.pengguna?.nama || '').trim() === nama && normalisasiJam(new Date(item?.jamMasuk).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })) === normalisasiJam(jamMasuk))
            || rekapData.find((item) => String(item?.pengguna?.nama || '').trim() === nama)
            || null;
        }

        async function bukaModal(item) {
          const lama = document.getElementById('zaman-edit-lokasi-modal');
          if (lama) lama.remove();
          const overlay = document.createElement('div');
          overlay.id = 'zaman-edit-lokasi-modal';
          const box = document.createElement('div');
          box.className = 'zaman-edit-lokasi-box';
          box.innerHTML = `
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px">
              <div><div style="font-size:17px;font-weight:800;color:#172033">Edit Lokasi Masuk</div><div style="margin-top:5px;font-size:12px;color:#667085">${String(item?.pengguna?.nama || 'Karyawan').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>
              <button type="button" data-close aria-label="Tutup" style="border:0;background:transparent;color:#667085;font-size:24px;line-height:1;cursor:pointer">×</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
              <div><label style="display:block;margin-bottom:6px;font-size:12px;font-weight:800;color:#344054">Latitude</label><input data-lat type="number" step="any" min="-90" max="90" value="${item?.latitudeMasuk ?? ''}" style="width:100%;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:12px;padding:10px;font:inherit" /></div>
              <div><label style="display:block;margin-bottom:6px;font-size:12px;font-weight:800;color:#344054">Longitude</label><input data-lng type="number" step="any" min="-180" max="180" value="${item?.longitudeMasuk ?? ''}" style="width:100%;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:12px;padding:10px;font:inherit" /></div>
            </div>
            <label style="display:block;margin-bottom:8px;font-size:12px;font-weight:800;color:#344054">Alamat lengkap lokasi</label>
            <textarea data-alamat rows="5" maxlength="500" placeholder="Alamat lokasi absensi">${String(item?.alamatMasuk || '').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
            <div style="display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:#667085"><span>Koordinat dan alamat disimpan sebagai satu data lokasi absensi.</span><span data-count></span></div>
            <div data-error style="min-height:18px;margin-top:8px;font-size:12px;color:#B42318"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="button" data-close style="border:1px solid #D0D5DD;background:#fff;color:#344054;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer">Batal</button><button type="button" data-save style="border:0;background:#0B6E45;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Simpan Alamat</button></div>
          `;
          overlay.appendChild(box);
          document.body.appendChild(overlay);
          const latitudeInput = box.querySelector('[data-lat]');
          const longitudeInput = box.querySelector('[data-lng]');
          const textarea = box.querySelector('[data-alamat]');
          const count = box.querySelector('[data-count]');
          const error = box.querySelector('[data-error]');
          const updateCount = () => { count.textContent = `${textarea.value.length}/500`; };
          updateCount();
          textarea.addEventListener('input', updateCount);
          const close = () => overlay.remove();
          box.querySelectorAll('[data-close]').forEach((button) => button.addEventListener('click', close));
          overlay.addEventListener('mousedown', (event) => { if (event.target === overlay) close(); });
          box.querySelector('[data-save]').addEventListener('click', async () => {
            const alamatMasuk = textarea.value.trim();
            const latitudeMasuk = Number(latitudeInput.value);
            const longitudeMasuk = Number(longitudeInput.value);
            error.textContent = '';
            if (!Number.isFinite(latitudeMasuk) || latitudeMasuk < -90 || latitudeMasuk > 90) { error.textContent = 'Latitude harus berada antara -90 dan 90.'; latitudeInput.focus(); return; }
            if (!Number.isFinite(longitudeMasuk) || longitudeMasuk < -180 || longitudeMasuk > 180) { error.textContent = 'Longitude harus berada antara -180 dan 180.'; longitudeInput.focus(); return; }
            if (!alamatMasuk) { error.textContent = 'Alamat lokasi wajib diisi.'; textarea.focus(); return; }
            if (alamatMasuk.length > 500) { error.textContent = 'Alamat maksimal 500 karakter.'; textarea.focus(); return; }
            const save = box.querySelector('[data-save]');
            save.disabled = true;
            save.textContent = 'Menyimpan…';
            try {
              const response = await originalFetch(`${apiBase || '/api'}/admin/absensi/${item.id}/edit-lokasi`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('token') || ''}` },
                body: JSON.stringify({ latitudeMasuk, longitudeMasuk, alamatMasuk }),
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(data?.pesan || 'Gagal mengubah alamat lokasi.');
              close();
              window.location.reload();
            } catch (errorSave) {
              save.disabled = false;
              save.textContent = 'Simpan Alamat';
              error.textContent = errorSave?.message || 'Tidak bisa terhubung ke server.';
            }
          });
        }

        function tambahAksi(row) {
          if (!row || !row.querySelector('td')) return;
          if (row.querySelector('[data-zaman-location-action]')) return;
          const cells = row.querySelectorAll('td');
          const empty = cells[0]?.textContent?.trim() === '';
          if (empty) return;
          const cell = document.createElement('td');
          cell.style.width = '130px';
          cell.style.minWidth = '130px';
          cell.style.padding = '8px 10px';
          cell.style.textAlign = 'center';
          cell.style.verticalAlign = 'middle';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'zaman-lokasi-action';
          button.dataset.zamanLocationAction = 'true';
          button.textContent = 'Edit Lokasi';
          button.style.width = '100%';
          button.style.minHeight = '34px';
          button.style.padding = '7px 10px';
          button.style.border = '1px solid #D0D5DD';
          button.style.borderRadius = '8px';
          button.style.background = '#FFFFFF';
          button.style.color = '#16233D';
          button.style.fontSize = '11px';
          button.style.fontWeight = '750';
          button.style.cursor = 'pointer';
          button.addEventListener('click', async () => {
            const item = ambilItemDariBaris(row);
            if (!item) { window.alert('Data absensi tidak ditemukan. Muat ulang halaman Admin lalu coba lagi.'); return; }
            await bukaModal(item);
          });
          cell.appendChild(button);
          row.appendChild(cell);
        }

        function tandaiTabelRekap() {
          document.querySelectorAll('.main-area-admin table').forEach((table) => {
            if (table.dataset.zamanRekapReady === 'true') return;
            const header = [...table.querySelectorAll('thead th')].map((th) => (th.textContent || '').trim().toLowerCase());
            if (!header.includes('karyawan') || !header.includes('lokasi masuk')) return;
            table.dataset.zamanRekapReady = 'true';
            table.classList.add('zaman-rekap-table');
            const theadRow = table.querySelector('thead tr');
            if (theadRow && !theadRow.querySelector('[data-zaman-action-head]')) {
              const th = document.createElement('th');
              th.dataset.zamanActionHead = 'true';
              th.textContent = 'Aksi';
              th.style.width = '130px';
              th.style.minWidth = '130px';
              th.style.textAlign = 'center';
              th.style.verticalAlign = 'middle';
              theadRow.appendChild(th);
            }
            table.querySelectorAll('tbody tr').forEach((row) => tambahAksi(row));
          });
        }

        function jalankan() {
          tandaiTabelRekap();
          document.querySelectorAll('.main-area-admin table.zaman-rekap-table tbody tr').forEach(tambahAksi);
        }

        const observer = new MutationObserver(jalankan);
        observer.observe(document.body, { childList: true, subtree: true });
        window.setInterval(jalankan, 1000);
        window.addEventListener('load', () => window.setTimeout(jalankan, 500));
      })();
    </script>
  </body>
</html>
