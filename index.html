<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi PT. Zaman Teknindo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        let sesiKameraTerlihat = null;

        const perbaruiStatusLokasiKamera = () => {
          const section = document.querySelector('.cameraSection');

          if (!section) {
            sesiKameraTerlihat = null;
            window.__zamanLokasiSesiAktif = false;
            window.__zamanLokasiSudahDitemukan = false;
            return;
          }

          if (section !== sesiKameraTerlihat) {
            sesiKameraTerlihat = section;
            window.__zamanLokasiSesiAktif = true;
            window.__zamanLokasiSudahDitemukan = false;
            window.__zamanLokasiTerakhir = null;
          }

          const lokasi = window.__zamanLokasiTerakhir;
          const masihFresh =
            lokasi &&
            Number.isFinite(lokasi.latitude) &&
            Number.isFinite(lokasi.longitude) &&
            Number.isFinite(lokasi.accuracy) &&
            Date.now() - lokasi.pada <= 120000;

          if (masihFresh) window.__zamanLokasiSudahDitemukan = true;
        };

        window.setInterval(perbaruiStatusLokasiKamera, 250);
        window.addEventListener('pageshow', perbaruiStatusLokasiKamera);
        document.addEventListener('visibilitychange', perbaruiStatusLokasiKamera);
      })();
    </script>
    <script>
      (() => {
        let apiBase = '';
        let rekapTerkini = [];
        let modePengaturan = false;
        let extraSettingsSiap = false;

        const PREF_KEY = 'zaman-admin-preferences';
        const fetchAsli = window.fetch.bind(window);

        const bacaPreferensi = () => {
          try {
            const data = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
            return {
              density: ['ringkas', 'normal', 'lega'].includes(data.density) ? data.density : 'normal',
              showPhotos: data.showPhotos !== false,
            };
          } catch {
            return { density: 'normal', showPhotos: true };
          }
        };

        const simpanPreferensi = (prefs) => {
          try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {}
        };

        const preferensi = bacaPreferensi();

        const fetchAman = async (...args) => {
          const input = args[0];
          const url = typeof input === 'string' ? input : input?.url || '';
          if (!apiBase && url.includes('/api/')) apiBase = url.slice(0, url.indexOf('/api/')) + '/api';
          const response = await fetchAsli(...args);
          if (/\/api\/admin\/rekap-(hari-ini|tanggal)/.test(url)) {
            try {
              const body = await response.clone().json();
              if (Array.isArray(body?.data)) rekapTerkini = body.data;
            } catch {}
          }
          return response;
        };
        window.fetch = fetchAman;

        const gaya = (el, nilai) => Object.assign(el.style, nilai);

        function ensureStyle() {
          if (document.getElementById('zaman-admin-preference-style')) return;
          const style = document.createElement('style');
          style.id = 'zaman-admin-preference-style';
          style.textContent = `
            html[data-zaman-admin-density="ringkas"] .zaman-rekap-table th,
            html[data-zaman-admin-density="ringkas"] .zaman-rekap-table td { padding-top: 7px !important; padding-bottom: 7px !important; }
            html[data-zaman-admin-density="normal"] .zaman-rekap-table th,
            html[data-zaman-admin-density="normal"] .zaman-rekap-table td { padding-top: 12px !important; padding-bottom: 12px !important; }
            html[data-zaman-admin-density="lega"] .zaman-rekap-table th,
            html[data-zaman-admin-density="lega"] .zaman-rekap-table td { padding-top: 17px !important; padding-bottom: 17px !important; }
            html[data-zaman-admin-show-photos="false"] .zaman-rekap-table th:nth-child(2),
            html[data-zaman-admin-show-photos="false"] .zaman-rekap-table td:nth-child(2) { display:none !important; }
            .zaman-setting-card { border:1px solid #e4e7ec; border-radius:14px; background:#fff; padding:14px; }
            .zaman-setting-title { margin:0 0 5px; font-size:13px; font-weight:800; color:#172033; }
            .zaman-setting-sub { margin:0 0 12px; font-size:11px; color:#667085; line-height:1.5; }
            .zaman-setting-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
            .zaman-setting-btn { border:1px solid #d0d5dd; background:#fff; color:#344054; border-radius:9px; padding:8px 11px; font:600 12px inherit; cursor:pointer; }
            .zaman-setting-btn.active { border-color:#1d4ed8; background:#eff6ff; color:#1d4ed8; }
            .zaman-setting-input { width:100%; box-sizing:border-box; border:1px solid #d0d5dd; border-radius:9px; padding:9px 10px; font:inherit; font-size:12px; }
            .zaman-setting-select { border:1px solid #d0d5dd; border-radius:9px; padding:8px 10px; font:inherit; font-size:12px; background:#fff; }
          `;
          document.head.appendChild(style);
        }

        function applyPreferences() {
          ensureStyle();
          document.documentElement.dataset.zamanAdminDensity = preferensi.density;
          document.documentElement.dataset.zamanAdminShowPhotos = String(preferensi.showPhotos);
        }
        applyPreferences();

        function formatJam(iso) {
          if (!iso) return '';
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return '';
          return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function angkaJam(teks) { return String(teks || '').replace(/[^0-9]/g, '').slice(0, 4); }

        function tandaiRekapTable() {
          document.querySelectorAll('table').forEach((table) => {
            const header = [...table.querySelectorAll('thead th')].map((th) => (th.textContent || '').trim().toLowerCase());
            if (header.includes('foto') && header.includes('pulang') && header.includes('lokasi')) table.classList.add('zaman-rekap-table');
          });
          applyPreferences();
        }

        function ambilSettingsSection() {
          return [...document.querySelectorAll('section')].find((el) => /Pengaturan Sistem/i.test(el.textContent || '')) || null;
        }

        function tandaiPengaturan() {
          const section = ambilSettingsSection();
          if (!section) return null;
          section.dataset.zamanSettingsSection = 'true';
          return section;
        }

        function tampilkanSectionNormal() {
          const section = tandaiPengaturan();
          if (!section || !section.parentElement) return;
          [...section.parentElement.children].forEach((anak) => {
            if (anak === section) anak.style.display = modePengaturan ? 'block' : 'none';
            else if (modePengaturan) anak.style.display = 'none';
            else if (anak.dataset.zamanHiddenBySettings === 'true') { anak.style.display = ''; delete anak.dataset.zamanHiddenBySettings; }
          });
          if (modePengaturan) [...section.parentElement.children].forEach((anak) => { if (anak !== section) anak.dataset.zamanHiddenBySettings = 'true'; });
        }

        async function simpanPotonganDanJam(data, feedbackEl) {
          try {
            const response = await fetch(`${apiBase || '/api'}/admin/pengaturan-potongan`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('token') || ''}` },
              body: JSON.stringify(data),
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result?.pesan || 'Gagal menyimpan pengaturan.');
            feedbackEl.textContent = result?.pesan || 'Pengaturan berhasil disimpan.';
            feedbackEl.style.color = '#15803d';
          } catch (error) {
            feedbackEl.textContent = error?.message || 'Tidak bisa terhubung ke server.';
            feedbackEl.style.color = '#b42318';
          }
        }

        function tambahPengaturanTambahan(section) {
          if (!section || extraSettingsSiap || section.querySelector('[data-zaman-extra-settings="true"]')) return;
          const container = document.createElement('div');
          container.dataset.zamanExtraSettings = 'true';
          gaya(container, { borderTop: '1px solid #e4e7ec', padding: '16px', display: 'grid', gap: '12px' });
          container.innerHTML = `
            <div class="zaman-setting-card">
              <p class="zaman-setting-title">Tampilan Rekap</p>
              <p class="zaman-setting-sub">Admin bisa memilih kepadatan tabel dan apakah foto absensi ditampilkan.</p>
              <div class="zaman-setting-row" data-density></div>
              <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#344054;cursor:pointer">
                <input type="checkbox" data-show-photos /> Tampilkan foto masuk & pulang di Rekap
              </label>
            </div>
            <div class="zaman-setting-card">
              <p class="zaman-setting-title">Aturan Absensi & Potongan Gaji</p>
              <p class="zaman-setting-sub">Jam masuk standar menentukan tepat waktu/telat. Nilai potongan dipakai saat perhitungan gaji.</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px">
                <div><label style="display:block;font-size:11px;color:#667085;font-weight:700;margin-bottom:5px">Jam Masuk Standar</label><input class="zaman-setting-input" type="time" data-jam value="08:10" /></div>
                <div><label style="display:block;font-size:11px;color:#667085;font-weight:700;margin-bottom:5px">Potongan Telat (Rp)</label><input class="zaman-setting-input" type="number" min="0" data-telat value="10000" /></div>
                <div><label style="display:block;font-size:11px;color:#667085;font-weight:700;margin-bottom:5px">Potongan Alpha (Rp)</label><input class="zaman-setting-input" type="number" min="0" data-alpha value="15000" /></div>
              </div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:10px"><button type="button" class="zaman-setting-btn" data-save-rules>Simpan Aturan</button><span data-feedback style="font-size:11px;color:#667085"></span></div>
            </div>
            <div class="zaman-setting-card">
              <p class="zaman-setting-title">Halaman Awal Admin</p>
              <p class="zaman-setting-sub">Pilih menu yang otomatis dibuka saat Admin kembali ke dashboard.</p>
              <div class="zaman-setting-row"><select class="zaman-setting-select" data-default-tab><option value="rekap">Rekap Hari Ini</option><option value="approval">Menunggu</option><option value="karyawan">Karyawan</option><option value="izin">Izin</option><option value="gaji">Gaji</option><option value="gaji-massal">Gaji Massal</option><option value="kantor">Kantor Pusat</option></select><button type="button" class="zaman-setting-btn" data-save-default>Simpan sebagai halaman awal</button></div>
            </div>
            <div class="zaman-setting-card">
              <p class="zaman-setting-title">Pintasan Admin</p>
              <p class="zaman-setting-sub">Akses cepat ke fungsi yang sudah tersedia tanpa memenuhi halaman Rekap.</p>
              <div class="zaman-setting-row"><button type="button" class="zaman-setting-btn" data-open-password>Ganti Password</button><button type="button" class="zaman-setting-btn" data-reset-view>Reset Tampilan</button></div>
            </div>`;

          const densityWrap = container.querySelector('[data-density]');
          ['ringkas','normal','lega'].forEach((mode) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'zaman-setting-btn' + (preferensi.density === mode ? ' active' : '');
            button.textContent = mode[0].toUpperCase() + mode.slice(1);
            button.addEventListener('click', () => {
              preferensi.density = mode;
              simpanPreferensi(preferensi);
              applyPreferences();
              densityWrap.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.textContent.toLowerCase() === mode));
              tandaiRekapTable();
            });
            densityWrap.appendChild(button);
          });

          const photos = container.querySelector('[data-show-photos]');
          photos.checked = preferensi.showPhotos;
          photos.addEventListener('change', () => { preferensi.showPhotos = photos.checked; simpanPreferensi(preferensi); applyPreferences(); tandaiRekapTable(); });

          const select = container.querySelector('[data-default-tab]');
          try { select.value = sessionStorage.getItem('admin-tab') || 'rekap'; } catch {}
          container.querySelector('[data-save-default]').addEventListener('click', () => {
            try { sessionStorage.setItem('admin-tab', select.value); } catch {}
            const target = [...document.querySelectorAll('button')].find((b) => (b.textContent || '').trim() === ({ rekap:'Rekap Hari Ini', approval:'Menunggu', karyawan:'Karyawan', izin:'Izin', gaji:'Gaji', 'gaji-massal':'Gaji Massal', kantor:'Kantor Pusat' }[select.value]));
            target?.click();
            const feedback = container.querySelector('[data-feedback]');
            feedback.textContent = 'Halaman awal disimpan.';
            feedback.style.color = '#15803d';
          });

          container.querySelector('[data-open-password]').addEventListener('click', () => { window.location.href = '/ganti-password'; });
          container.querySelector('[data-reset-view]').addEventListener('click', () => { preferensi.density = 'normal'; preferensi.showPhotos = true; simpanPreferensi(preferensi); applyPreferences(); photos.checked = true; densityWrap.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.textContent.toLowerCase() === 'normal')); });

          const token = localStorage.getItem('token') || '';
          fetch(`${apiBase || '/api'}/admin/pengaturan-potongan`, { headers: { Authorization: `Bearer ${token}` } }).then((r) => r.json().catch(() => ({}))).then((data) => {
            if (!data?.data) return;
            container.querySelector('[data-jam]').value = String(data.data.jamMasukStandar || '08:10:00').slice(0,5);
            container.querySelector('[data-telat]').value = Number(data.data.potonganTelat) || 0;
            container.querySelector('[data-alpha]').value = Number(data.data.potonganAlpha) || 0;
          }).catch(() => {});

          container.querySelector('[data-save-rules]').addEventListener('click', () => {
            const feedback = container.querySelector('[data-feedback]');
            simpanPotonganDanJam({ jamMasukStandar: container.querySelector('[data-jam]').value, potonganTelat: Number(container.querySelector('[data-telat]').value) || 0, potonganAlpha: Number(container.querySelector('[data-alpha]').value) || 0 }, feedback);
          });

          section.appendChild(container);
          extraSettingsSiap = true;
        }

        function pasangMenuPengaturan() {
          const kantor = [...document.querySelectorAll('button')].find((b) => (b.textContent || '').trim() === 'Kantor Pusat');
          if (!kantor || document.querySelector('[data-zaman-pengaturan-menu="true"]')) return;
          const tombol = kantor.cloneNode(true);
          tombol.dataset.zamanPengaturanMenu = 'true';
          tombol.removeAttribute('disabled');
          tombol.textContent = '⚙ Pengaturan';
          tombol.addEventListener('click', (event) => {
            event.preventDefault(); event.stopPropagation();
            modePengaturan = true;
            terapkanModePengaturan?.();
            const section = tandaiPengaturan();
            tambahPengaturanTambahan(section);
            tampilkanSectionNormal();
            section?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          kantor.parentElement?.appendChild(tombol);
        }

        function tampilkanSectionNormal() {
          const section = tandaiPengaturan();
          if (!section || !section.parentElement) return;
          [...section.parentElement.children].forEach((anak) => {
            if (anak === section) anak.style.display = modePengaturan ? 'block' : 'none';
            else if (modePengaturan) anak.style.display = 'none';
            else if (anak.dataset.zamanHiddenBySettings === 'true') { anak.style.display = ''; delete anak.dataset.zamanHiddenBySettings; }
          });
          if (modePengaturan) [...section.parentElement.children].forEach((anak) => { if (anak !== section) anak.dataset.zamanHiddenBySettings = 'true'; });
        }

        function cariTargetRekapDariBaris(row) {
          const nama = row?.querySelector('td strong')?.textContent?.trim() || '';
          const jam = row?.querySelectorAll('td')?.[3]?.textContent?.trim() || '';
          return rekapTerkini.find((item) => String(item?.pengguna?.nama || '').trim() === nama && angkaJam(formatJam(item.jamMasuk)) === angkaJam(jam)) || rekapTerkini.find((item) => String(item?.pengguna?.nama || '').trim() === nama) || null;
        }

        async function modalEditLokasi(item) {
          const lama = document.getElementById('zaman-edit-lokasi-modal');
          if (lama) lama.remove();
          const overlay = document.createElement('div');
          overlay.id = 'zaman-edit-lokasi-modal';
          gaya(overlay, { position:'fixed', inset:'0', zIndex:'99999', display:'flex', alignItems:'center', justifyContent:'center', padding:'16px', background:'rgba(15,23,42,.58)' });
          const box = document.createElement('div');
          gaya(box, { width:'100%', maxWidth:'560px', maxHeight:'calc(100vh - 32px)', overflowY:'auto', boxSizing:'border-box', background:'#fff', borderRadius:'18px', padding:'20px', boxShadow:'0 24px 70px rgba(0,0,0,.24)' });
          box.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px"><div><div style="font-size:17px;font-weight:800;color:#172033">Edit Lokasi Masuk</div><div style="margin-top:5px;font-size:12px;color:#667085">${item?.pengguna?.nama || 'Karyawan'}</div></div><button type="button" data-close aria-label="Tutup" style="border:0;background:transparent;color:#667085;font-size:24px;line-height:1;cursor:pointer">×</button></div><label style="display:block;margin-bottom:8px;font-size:12px;font-weight:800;color:#344054">Alamat lengkap lokasi</label><textarea data-alamat rows="5" maxlength="500" placeholder="Jl. Sadang Sari No.3, Sekeloa, Kecamatan Coblong, Kota Bandung, Jawa Barat 40133" style="width:100%;box-sizing:border-box;resize:vertical;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit;font-size:13px;line-height:1.5;outline:none"></textarea><div style="display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:#667085"><span>Hanya alamat yang diubah. Koordinat GPS tetap tersimpan.</span><span data-count>0/500</span></div><div data-error style="min-height:18px;margin-top:8px;font-size:12px;color:#b42318"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="button" data-close style="border:1px solid #d0d5dd;background:#fff;color:#344054;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer">Batal</button><button type="button" data-save style="border:0;background:#1d4ed8;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Simpan Alamat</button></div>`;
          const textarea = box.querySelector('[data-alamat]');
          textarea.value = item?.alamatMasuk || '';
          const count = box.querySelector('[data-count]');
          const error = box.querySelector('[data-error]');
          const refreshCount = () => { count.textContent = `${textarea.value.length}/500`; };
          textarea.addEventListener('input', refreshCount); refreshCount();
          const close = () => overlay.remove();
          box.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
          overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
          box.querySelector('[data-save]').addEventListener('click', async () => {
            const alamatMasuk = textarea.value.trim(); error.textContent = '';
            if (!alamatMasuk) { error.textContent = 'Alamat lengkap wajib diisi.'; textarea.focus(); return; }
            if (alamatMasuk.length > 500) { error.textContent = 'Alamat maksimal 500 karakter.'; textarea.focus(); return; }
            const save = box.querySelector('[data-save]'); save.disabled = true; save.textContent = 'Menyimpan…';
            try {
              const res = await fetch(`${apiBase || '/api'}/admin/absensi/${item.id}/edit-lokasi`, { method:'PUT', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${localStorage.getItem('token') || ''}` }, body:JSON.stringify({ alamatMasuk }) });
              const data = await res.json().catch(() => ({}));
              if (!res.ok) throw new Error(data?.pesan || 'Gagal mengubah alamat lokasi.');
              close(); window.location.reload();
            } catch (e) { save.disabled=false; save.textContent='Simpan Alamat'; error.textContent=e?.message || 'Tidak bisa terhubung ke server.'; }
          });
          overlay.appendChild(box); document.body.appendChild(overlay); setTimeout(() => textarea.focus(), 0);
        }

        const tanganiEditLokasi = async (event) => {
          const tombol = event.target.closest?.('button');
          if (!tombol || (tombol.textContent || '').trim() !== 'Edit Lokasi') return;
          event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
          const row = tombol.closest('tr');
          let target = cariTargetRekapDariBaris(row);
          if (!target) {
            try {
              const dateInput = document.querySelector('input[type="date"]');
              const tanggal = dateInput?.value || new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Jakarta' });
              const res = await fetch(`${apiBase || '/api'}/admin/rekap-tanggal?tanggal=${encodeURIComponent(tanggal)}`, { headers:{ Authorization:`Bearer ${localStorage.getItem('token') || ''}` } });
              const data = await res.json().catch(() => ({}));
              if (Array.isArray(data?.data)) rekapTerkini = data.data;
              target = cariTargetRekapDariBaris(row);
            } catch {}
          }
          if (!target) { window.alert('Data absensi tidak ditemukan. Muat ulang halaman Admin lalu coba lagi.'); return; }
          await modalEditLokasi(target);
        };
        document.addEventListener('pointerdown', tanganiEditLokasi, true);
        document.addEventListener('mousedown', tanganiEditLokasi, true);
        document.addEventListener('click', tanganiEditLokasi, true);

        const tanganiKembali = (event) => {
          const tombol = event.target.closest?.('button');
          if (!tombol || (tombol.textContent || '').trim() !== 'Rekap Hari Ini' || !modePengaturan) return;
          modePengaturan = false; tampilkanSectionNormal();
          const menu = document.querySelector('[data-zaman-pengaturan-menu="true"]');
          if (menu) { menu.style.fontWeight=''; menu.style.outline=''; }
        };
        document.addEventListener('click', tanganiKembali, true);

        const observer = new MutationObserver(() => {
          pasangMenuPengaturan();
          tandaiRekapTable();
          const section = tandaiPengaturan();
          if (section) tambahPengaturanTambahan(section);
          if (!modePengaturan && section) section.style.display = 'none';
          if (modePengaturan) tampilkanSectionNormal();
        });
        observer.observe(document.documentElement, { childList:true, subtree:true });

        setInterval(() => {
          pasangMenuPengaturan();
          tandaiRekapTable();
          const section = tandaiPengaturan();
          if (section) tambahPengaturanTambahan(section);
          if (!modePengaturan && section) section.style.display='none'; else if (modePengaturan) tampilkanSectionNormal();
        }, 800);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
