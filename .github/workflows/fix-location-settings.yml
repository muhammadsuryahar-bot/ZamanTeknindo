name: Apply GPS and Admin Settings Fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          
          root = Path('.')
          admin = root / 'src/pages/DashboardAdmin.jsx'
          employee = root / 'src/pages/DashboardKaryawan.jsx'
          
          a = admin.read_text(encoding='utf-8')
          e = employee.read_text(encoding='utf-8')
          
          # ---- Employee GPS robustness ----
          checks = [
              ('const LOKASI_REQUEST_TIMEOUT_MS = 20000;', 'const LOKASI_REQUEST_TIMEOUT_MS = 35000;'),
              (
                  'function jadwalkanLokasiSetelahKameraSiap(sesiKamera) {\n    const mulai = () => {\n      if (!mountedRef.current || !kameraAktif || kameraSesiRef.current !== sesiKamera || !kameraSiapRef.current) return;\n      window.setTimeout(() => {\n        if (mountedRef.current && kameraAktif && kameraSesiRef.current === sesiKamera && kameraSiapRef.current) {\n          ambilLokasi();\n        }\n      }, 180);\n    };\n\n    const video = videoRef.current;\n    if (video?.readyState >= 2) {\n      mulai();\n      return;\n    }\n    if (video) video.addEventListener("canplay", mulai, { once: true });\n    window.setTimeout(mulai, 1200);\n  }',
                  'function jadwalkanLokasiSetelahKameraSiap(sesiKamera) {\n    // GPS dimulai segera setelah sesi kamera aktif; jangan menunggu preview\n    // kamera benar-benar siap karena itu dapat membuang waktu GPS cold start.\n    window.setTimeout(() => {\n      if (!mountedRef.current || kameraSesiRef.current !== sesiKamera || !streamRef.current) return;\n      ambilLokasi();\n    }, 80);\n  }'
              ),
              (
                  'const sesiMasihAktif = () => mountedRef.current && sesi === lokasiSesiRef.current && kameraSiapRef.current;',
                  'const sesiMasihAktif = () => mountedRef.current && sesi === lokasiSesiRef.current && kameraAktif;'
              ),
              ('if (akurasi <= 20) void selesaikan();', 'if (akurasi <= 50) void selesaikan();'),
              (
                  '          setKameraAktif(true);\n      requestAnimationFrame(() => jadwalkanLokasiSetelahKameraSiap(sesiKamera));',
                  '          setKameraAktif(true);'
              ),
              (
                  '      jadwalkanLokasiSetelahKameraSiap(sesiKamera);\n    };',
                  '      // GPS sudah dimulai saat sesi kamera aktif, jadi preview\n      // kamera tidak menjadi bottleneck untuk memperoleh lokasi.\n    };'
              )
          ]
          for old, new in checks:
              if old not in e:
                  raise SystemExit(f'GPS replacement target not found: {old[:90]!r}')
              e = e.replace(old, new, 1)
          
          # ---- Admin settings ----
          old = '  MapPin,\n  Info,\n  AlertTriangle,'
          new = '  MapPin,\n  Info,\n  AlertTriangle,\n  Settings,\n  Save,\n  Navigation,'
          if old not in a:
              raise SystemExit('Admin icon import target not found')
          a = a.replace(old, new, 1)
          
          old = '  const [sedangSimpanKantor, setSedangSimpanKantor] = useState(false);\n\n  // Konfirmasi ubah status'
          new = '''  const [sedangSimpanKantor, setSedangSimpanKantor] = useState(false);\n\n  // Pengaturan cepat dari Rekap Hari Ini. Pengaturan tetap menggunakan\n  // endpoint resmi yang sama dengan halaman Kantor/Gaji.\n  const [pengaturanTerbuka, setPengaturanTerbuka] = useState(false);\n  const [pengaturanJam, setPengaturanJam] = useState("08:10");\n  const [pengaturanMemuat, setPengaturanMemuat] = useState(false);\n  const [pengaturanMenyimpanJam, setPengaturanMenyimpanJam] = useState(false);\n  const [pengaturanKantorId, setPengaturanKantorId] = useState("");\n\n  // Konfirmasi ubah status'''
          if old not in a:
              raise SystemExit('Admin settings state target not found')
          a = a.replace(old, new, 1)
          
          anchor = '''  async function bukaFormAktivasi(id) {'''
          insert = '''  async function bukaPengaturanCepat() {\n    const akanDibuka = !pengaturanTerbuka;\n    setPengaturanTerbuka(akanDibuka);\n    if (!akanDibuka) return;\n\n    setPengaturanMemuat(true);\n    try {\n      const kantorData = kantorSudahDimuat\n        ? daftarKantorState\n        : await muatKantor();\n\n      const kantorPertama = kantorData?.[0] || null;\n      if (kantorPertama) {\n        setPengaturanKantorId(String(kantorPertama.id));\n        setKantorEditId(kantorPertama.id);\n        setFormKantor({\n          namaKantor: kantorPertama.namaKantor || "",\n          alamat: kantorPertama.alamat || "",\n          latitude: kantorPertama.latitude ?? "",\n          longitude: kantorPertama.longitude ?? "",\n        });\n      }\n\n      const res = await fetch(`${API_URL}/admin/pengaturan-potongan`, {\n        headers: { Authorization: `Bearer ${getToken()}` },\n      });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok) throw new Error(data?.pesan || "Gagal memuat pengaturan jam masuk.");\n      const jam = String(data?.data?.jamMasukStandar || "08:10:00");\n      setPengaturanJam(jam.slice(0, 5));\n    } catch (err) {\n      console.error("Gagal memuat pengaturan cepat:", err);\n      setPesan(err?.message || "Gagal memuat pengaturan.");\n    } finally {\n      setPengaturanMemuat(false);\n    }\n  }\n\n  function pilihKantorPengaturan(id) {\n    setPengaturanKantorId(String(id));\n    const kantor = daftarKantorState.find((item) => String(item.id) === String(id));\n    if (!kantor) return;\n    setKantorEditId(kantor.id);\n    setFormKantor({\n      namaKantor: kantor.namaKantor || "",\n      alamat: kantor.alamat || "",\n      latitude: kantor.latitude ?? "",\n      longitude: kantor.longitude ?? "",\n    });\n  }\n\n  function gunakanLokasiKantorSekarang() {\n    if (!navigator.geolocation) {\n      setPesan("Browser/perangkat ini tidak menyediakan lokasi GPS.");\n      return;\n    }\n\n    setPesan("");\n    navigator.geolocation.getCurrentPosition(\n      (posisi) => {\n        const latitude = Number(posisi.coords.latitude);\n        const longitude = Number(posisi.coords.longitude);\n        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {\n          setPesan("Koordinat GPS tidak valid. Coba ambil lokasi lagi.");\n          return;\n        }\n        setFormKantor((lama) => ({\n          ...lama,\n          latitude: latitude.toFixed(7),\n          longitude: longitude.toFixed(7),\n        }));\n        setPesanSukses("Lokasi perangkat berhasil diambil. Tekan Simpan Lokasi untuk menerapkannya.");\n      },\n      (error) => {\n        console.warn("GPS Admin gagal:", error);\n        setPesan("Lokasi belum berhasil diperoleh. Pastikan GPS/lokasi aktif dan izin lokasi untuk dashboard Admin diberikan.");\n      },\n      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 },\n    );\n  }\n\n  async function simpanJamMasukCepat() {\n    if (!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(pengaturanJam)) {\n      setPesan("Jam masuk harus menggunakan format HH:MM, contoh 08:10.");\n      return;\n    }\n\n    setPengaturanMenyimpanJam(true);\n    setPesan("");\n    try {\n      const res = await fetch(`${API_URL}/admin/pengaturan-potongan`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify({\n          potonganTelat: 0,\n          potonganAlpha: 0,\n          jamMasukStandar: pengaturanJam,\n        }),\n      });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok) throw new Error(data?.pesan || "Gagal menyimpan jam masuk standar.");\n      setPesanSukses(data?.pesan || "Jam masuk standar berhasil diperbarui.");\n    } catch (err) {\n      console.error("Gagal menyimpan jam masuk standar:", err);\n      setPesan(err?.message || "Gagal menyimpan jam masuk standar.");\n    } finally {\n      setPengaturanMenyimpanJam(false);\n    }\n  }\n\n  async function bukaFormAktivasi(id) {'''
          if anchor not in a:
              raise SystemExit('Admin function insertion anchor not found')
          a = a.replace(anchor, insert, 1)
          
          # The endpoint requires existing potongan values. Before saving quick jam,\n          # load the current values instead of overwriting them with zero.
          old = '''      const res = await fetch(`${API_URL}/admin/pengaturan-potongan`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify({\n          potonganTelat: 0,\n          potonganAlpha: 0,\n          jamMasukStandar: pengaturanJam,\n        }),\n      });'''
          new = '''      const pengaturanSekarangRes = await fetch(`${API_URL}/admin/pengaturan-potongan`, {\n        headers: { Authorization: `Bearer ${getToken()}` },\n      });\n      const pengaturanSekarang = await pengaturanSekarangRes.json().catch(() => ({}));\n      if (!pengaturanSekarangRes.ok) throw new Error(pengaturanSekarang?.pesan || "Gagal membaca pengaturan gaji.");\n\n      const res = await fetch(`${API_URL}/admin/pengaturan-potongan`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify({\n          potonganTelat: pengaturanSekarang?.data?.potonganTelat ?? 10000,\n          potonganAlpha: pengaturanSekarang?.data?.potonganAlpha ?? 15000,\n          jamMasukStandar: pengaturanJam,\n        }),\n      });'''
          if old not in a:
              raise SystemExit('Quick jam save target not found')
          a = a.replace(old, new, 1)
          
          # Insert quick settings below the Rekap table, before the approval tab.
          anchor = '''                <div\n                  className="tabel-fade-kanan"\n                  style={{ ...styles.tabelFade, opacity: rekapDiUjung ? 0 : 1 }}\n                />\n              </div>\n            </>\n          )}\n\n          {tab === "approval" && ('''
          panel = '''                <div\n                  className="tabel-fade-kanan"\n                  style={{ ...styles.tabelFade, opacity: rekapDiUjung ? 0 : 1 }}\n                />\n              </div>\n\n              <section\n                style={{\n                  marginTop: 18,\n                  border: `1px solid ${warna.garis}`,\n                  borderRadius: 14,\n                  background: warna.panel,\n                  overflow: "hidden",\n                }}\n              >\n                <button\n                  type="button"\n                  onClick={() => void bukaPengaturanCepat()}\n                  style={{\n                    width: "100%",\n                    border: 0,\n                    background: "transparent",\n                    padding: "14px 16px",\n                    display: "flex",\n                    alignItems: "center",\n                    justifyContent: "space-between",\n                    gap: 12,\n                    cursor: "pointer",\n                    color: warna.tinta,\n                    textAlign: "left",\n                  }}\n                >\n                  <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontWeight: 800, fontSize: 13 }}>\n                    <Settings size={16} style={{ color: warna.aksen }} />\n                    Pengaturan Sistem\n                  </span>\n                  <span style={{ color: warna.tintaSamar, fontSize: 12 }}>\n                    {pengaturanTerbuka ? "Tutup" : "Buka pengaturan"}\n                  </span>\n                </button>\n\n                {pengaturanTerbuka && (\n                  <div style={{ borderTop: `1px solid ${warna.garis}`, padding: 16 }}>\n                    {pengaturanMemuat ? (\n                      <div style={{ fontSize: 12, color: warna.tintaSamar }}>Memuat pengaturan…</div>\n                    ) : (\n                      <div style={{ display: "grid", gap: 16 }}>\n                        <div>\n                          <p style={{ margin: "0 0 8px", fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>\n                            Jam Masuk Standar\n                          </p>\n                          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>\n                            <input\n                              type="time"\n                              value={pengaturanJam}\n                              onChange={(e) => setPengaturanJam(e.target.value)}\n                              style={{ ...styles.inputForm, width: 150 }}\n                            />\n                            <button\n                              type="button"\n                              onClick={() => void simpanJamMasukCepat()}\n                              style={{ ...styles.tombolAktifkan, display: "inline-flex", alignItems: "center", gap: 6 }}\n                              disabled={pengaturanMenyimpanJam}\n                            >\n                              <Save size={14} />\n                              {pengaturanMenyimpanJam ? "Menyimpan…" : "Simpan Jam"}\n                            </button>\n                          </div>\n                          <p style={{ margin: "7px 0 0", fontSize: 11, color: warna.tintaSamar }}>\n                            Mulai setelah waktu ini akan dihitung sebagai telat sesuai aturan sistem.\n                          </p>\n                        </div>\n\n                        <div style={{ borderTop: `1px solid ${warna.garis}`, paddingTop: 16 }}>\n                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>\n                            <div>\n                              <p style={{ margin: 0, fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>\n                                Lokasi Kantor / Acuan Absensi\n                              </p>\n                              <p style={{ margin: "4px 0 0", fontSize: 11, color: warna.tintaSamar }}>\n                                Titik ini menjadi acuan radius absensi karyawan yang terhubung ke kantor.\n                              </p>\n                            </div>\n                            {daftarKantorState.length === 0 && <span style={{ fontSize: 11, color: warna.peringatan }}>Belum ada kantor</span>}\n                          </div>\n\n                          {daftarKantorState.length > 0 && (\n                            <>\n                              <select\n                                value={pengaturanKantorId}\n                                onChange={(e) => pilihKantorPengaturan(e.target.value)}\n                                style={{ ...styles.selectForm, width: "100%", maxWidth: 420, marginBottom: 10 }}\n                              >\n                                {daftarKantorState.map((k) => (\n                                  <option key={k.id} value={k.id}>{k.namaKantor}</option>\n                                ))}\n                              </select>\n\n                              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 10 }}>\n                                <div>\n                                  <label style={styles.labelForm}>Latitude</label>\n                                  <input\n                                    value={formKantor.latitude}\n                                    onChange={(e) => setFormKantor({ ...formKantor, latitude: e.target.value })}\n                                    style={styles.inputForm}\n                                    inputMode="decimal"\n                                  />\n                                </div>\n                                <div>\n                                  <label style={styles.labelForm}>Longitude</label>\n                                  <input\n                                    value={formKantor.longitude}\n                                    onChange={(e) => setFormKantor({ ...formKantor, longitude: e.target.value })}\n                                    style={styles.inputForm}\n                                    inputMode="decimal"\n                                  />\n                                </div>\n                              </div>\n\n                              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>\n                                <button\n                                  type="button"\n                                  onClick={gunakanLokasiKantorSekarang}\n                                  style={{ ...styles.tombolEditKecil, display: "inline-flex", alignItems: "center", gap: 6 }}\n                                >\n                                  <Navigation size={14} /> Gunakan Lokasi Saat Ini\n                                </button>\n                                <button\n                                  type="button"\n                                  onClick={() => void simpanKantor()}\n                                  style={{ ...styles.tombolAktifkan, display: "inline-flex", alignItems: "center", gap: 6 }}\n                                  disabled={sedangSimpanKantor}\n                                >\n                                  <Save size={14} />\n                                  {sedangSimpanKantor ? "Menyimpan…" : "Simpan Lokasi"}\n                                </button>\n                              </div>\n                            </>\n                          )}\n\n                          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 6, color: warna.tintaSamar, fontSize: 11 }}>\n                            <MapPin size={13} />\n                            Untuk pengaturan kantor lengkap, gunakan menu <button type="button" onClick={() => pindahTab("kantor")} style={{ border: 0, background: "transparent", padding: 0, color: warna.aksen, fontWeight: 800, cursor: "pointer" }}>Kantor Pusat</button>.\n                          </div>\n                        </div>\n                      </div>\n                    )}\n                  </div>\n                )}\n              </section>\n            </>\n          )}\n\n          {tab === "approval" && ('''
          if anchor not in a:
              raise SystemExit('Admin rekap settings insertion anchor not found')
          a = a.replace(anchor, panel, 1)
          
          admin.write_text(a, encoding='utf-8')
          employee.write_text(e, encoding='utf-8')
          
          # Remove any accidental temporary files from earlier failed attempts.
          for p in [root/'src/tempfix_location.txt', root/'src/tempfix_location2.txt']:
              if p.exists(): p.unlink()
          PY
          
          npm ci
          npm run build
          
          if git diff --quiet; then
            echo 'No source changes produced.'
            exit 1
          fi
          
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/DashboardAdmin.jsx src/pages/DashboardKaryawan.jsx src/tempfix_location.txt src/tempfix_location2.txt
          git commit -m 'fix: harden GPS and add admin system settings'
          git push origin main

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          if [ -f .github/workflows/fix-location-settings.yml ]; then
            git rm .github/workflows/fix-location-settings.yml
            git commit -m 'chore: remove temporary fix workflow'
            git push origin main
          fi
