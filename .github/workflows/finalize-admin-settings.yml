name: Finalize Admin Settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Admin source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/DashboardAdmin.jsx')
          s = path.read_text(encoding='utf-8')

          # --- Dedicated Settings tab ---
          s = s.replace('      "kantor",\n    ];', '      "kantor",\n      "pengaturan",\n    ];', 1)
          s = s.replace('      kantor: tabAwal === "kantor",\n', '      kantor: tabAwal === "kantor",\n      pengaturan: tabAwal === "pengaturan",\n', 1)
          s = s.replace('  kantor: Building2,\n};', '  kantor: Building2,\n  pengaturan: Settings,\n};', 1)
          s = s.replace('    { id: "kantor", label: "Kantor Pusat" },\n  ];', '    { id: "kantor", label: "Kantor Pusat" },\n    { id: "pengaturan", label: "Pengaturan" },\n  ];', 1)
          s = s.replace('{ label: "SYSTEM", idTab: ["kantor"] },', '{ label: "SYSTEM", idTab: ["kantor", "pengaturan"] },', 1)

          # --- Admin appearance preference state ---
          marker = '  const [pengaturanKantorId, setPengaturanKantorId] = useState("");\n'
          insert = marker + '''  const [tampilanPadat, setTampilanPadat] = useState(() => {\n    try { return localStorage.getItem("zaman-admin-tampilan") === "padat"; } catch { return false; }\n  });\n  const [intervalRefresh, setIntervalRefresh] = useState(() => {\n    try {\n      const value = Number(localStorage.getItem("zaman-admin-refresh-interval"));\n      return [15, 30, 60].includes(value) ? value : 15;\n    } catch { return 15; }\n  });\n  useEffect(() => {\n    try { localStorage.setItem("zaman-admin-tampilan", tampilanPadat ? "padat" : "nyaman"); } catch {}\n    document.documentElement.dataset.adminDensity = tampilanPadat ? "padat" : "nyaman";\n  }, [tampilanPadat]);\n\n  useEffect(() => {\n    try { localStorage.setItem("zaman-admin-refresh-interval", String(intervalRefresh)); } catch {}\n  }, [intervalRefresh]);\n'''
          if 'const [tampilanPadat, setTampilanPadat]' not in s:
            s = s.replace(marker, insert, 1)

          # Refresh interval follows the Admin preference instead of a hard-coded 15 seconds.
          s = s.replace('intervalId = window.setInterval(refreshDashboard, 15000);', 'intervalId = window.setInterval(refreshDashboard, intervalRefresh * 1000);', 1)
          s = s.replace('  }, [tanggalRekap]);\n\n  useEffect(() => {\n    if (tab === "karyawan")', '  }, [tanggalRekap, intervalRefresh]);\n\n  useEffect(() => {\n    if (tab === "karyawan")', 1)

          # --- Replace native prompts with in-app address-only modal ---
          start = s.find('  async function editLokasiDenganDialog(item) {')
          end = s.find('\n  function bukaEditStatus(item) {', start)
          if start < 0 or end < 0:
            raise SystemExit('editLokasiDenganDialog block not found')
          new_fn = r'''  async function editLokasiDenganDialog(item) {
    const lama = document.getElementById("zaman-edit-lokasi-modal");
    if (lama) lama.remove();

    const escapeHtml = (nilai) => String(nilai ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const overlay = document.createElement("div");
    overlay.id = "zaman-edit-lokasi-modal";
    Object.assign(overlay.style, { position: "fixed", inset: "0", zIndex: "99999", display: "flex", alignItems: "center", justifyContent: "center", padding: "16px", background: "rgba(15,23,42,.58)" });

    const box = document.createElement("div");
    Object.assign(box.style, { width: "100%", maxWidth: "560px", maxHeight: "calc(100vh - 32px)", overflowY: "auto", boxSizing: "border-box", background: "#fff", borderRadius: "18px", padding: "20px", boxShadow: "0 24px 70px rgba(0,0,0,.24)" });

    box.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px">
        <div><div style="font-size:17px;font-weight:800;color:#172033">Edit Lokasi Masuk</div><div style="margin-top:5px;font-size:12px;color:#667085">${escapeHtml(item?.pengguna?.nama || "Karyawan")}</div></div>
        <button type="button" data-tutup="1" aria-label="Tutup" style="border:0;background:transparent;color:#667085;font-size:24px;line-height:1;cursor:pointer">×</button>
      </div>
      <label style="display:block;margin-bottom:8px;font-size:12px;font-weight:800;color:#344054">Alamat lengkap lokasi</label>
      <textarea data-alamat rows="5" maxlength="500" placeholder="Jl. Sadang Sari No.3, Sekeloa, Kecamatan Coblong, Kota Bandung, Jawa Barat 40133" style="width:100%;box-sizing:border-box;resize:vertical;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit;font-size:13px;line-height:1.5;outline:none"></textarea>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:#667085"><span>Koordinat GPS asli tetap tersimpan.</span><span data-jumlah>0/500</span></div>
      <div data-pesan style="min-height:18px;margin-top:8px;font-size:12px;color:#b42318"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="button" data-tutup="1" style="border:1px solid #d0d5dd;background:#fff;color:#344054;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer">Batal</button><button type="button" data-simpan style="border:0;background:#1d4ed8;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Simpan Alamat</button></div>`;

    const textarea = box.querySelector("[data-alamat]");
    const jumlah = box.querySelector("[data-jumlah]");
    const pesanModal = box.querySelector("[data-pesan]");
    const tombolSimpan = box.querySelector("[data-simpan]");
    textarea.value = item?.alamatMasuk || "";
    const perbaruiJumlah = () => { jumlah.textContent = `${textarea.value.length}/500`; };
    textarea.addEventListener("input", perbaruiJumlah);
    perbaruiJumlah();

    const tutup = () => { document.removeEventListener("keydown", tekanEscape); overlay.remove(); };
    const tekanEscape = (event) => { if (event.key === "Escape") tutup(); };
    box.querySelectorAll('[data-tutup="1"]').forEach((button) => button.addEventListener("click", tutup));
    overlay.addEventListener("mousedown", (event) => { if (event.target === overlay) tutup(); });
    document.addEventListener("keydown", tekanEscape);

    tombolSimpan.addEventListener("click", async () => {
      const alamatMasuk = textarea.value.trim();
      pesanModal.textContent = "";
      if (!alamatMasuk) { pesanModal.textContent = "Alamat lengkap wajib diisi."; textarea.focus(); return; }
      if (alamatMasuk.length > 500) { pesanModal.textContent = "Alamat maksimal 500 karakter."; textarea.focus(); return; }
      tombolSimpan.disabled = true;
      tombolSimpan.textContent = "Menyimpan…";
      try {
        const res = await fetch(`${API_URL}/admin/absensi/${item.id}/edit-lokasi`, { method: "PUT", headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}` }, body: JSON.stringify({ alamatMasuk }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.pesan || "Gagal mengubah alamat lokasi.");
        setRekap((lama) => lama.map((row) => row.id === item.id ? { ...row, ...(data?.data || {}), alamatMasuk } : row));
        tutup();
        setPesanSukses(data?.pesan || "Alamat lokasi berhasil diperbarui.");
      } catch (error) {
        tombolSimpan.disabled = false;
        tombolSimpan.textContent = "Simpan Alamat";
        pesanModal.textContent = error?.message || "Tidak bisa terhubung ke server.";
      }
    });
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => textarea.focus(), 0);
  }
'''
          s = s[:start] + new_fn + s[end:]

          # --- Move settings section out of Rekap and make it more complete ---
          pat = re.compile(r'\n              <section style=\{\{ marginTop: 18,.*?\n              </section>\n', re.S)
          match = pat.search(s)
          if not match:
            raise SystemExit('settings section not found')
          settings = match.group(0)
          s = s[:match.start()] + '\n' + s[match.end():]

          # Show salary deduction controls inside the existing settings panel.
          anchor = '                        <div style={{ borderTop: `1px solid ${warna.garis}`, paddingTop: 16 }}>\n                          <p style={{ margin: "0 0 4px", fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>Lokasi Kantor / Acuan Absensi</p>'
          deduction = '''                        <div style={{ borderTop: `1px solid ${warna.garis}`, paddingTop: 16 }}>\n                          <p style={{ margin: "0 0 8px", fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>Potongan Gaji</p>\n                          <p style={{ margin: "0 0 10px", fontSize: 11, color: warna.tintaSamar }}>Nilai ini dipakai saat perhitungan gaji bulanan.</p>\n                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 10 }}>\n                            <div><label style={styles.labelForm}>Potongan Telat (Rp)</label><input type="number" min="0" value={pengaturanPotongan.potonganTelat} onChange={(e) => setPengaturanPotongan({ ...pengaturanPotongan, potonganTelat: e.target.value })} style={styles.inputForm} /></div>\n                            <div><label style={styles.labelForm}>Potongan Alpha (Rp)</label><input type="number" min="0" value={pengaturanPotongan.potonganAlpha} onChange={(e) => setPengaturanPotongan({ ...pengaturanPotongan, potonganAlpha: e.target.value })} style={styles.inputForm} /></div>\n                          </div>\n                          <div style={{ marginTop: 10 }}><button type="button" onClick={() => void simpanJamMasukCepat()} style={{ ...styles.tombolAktifkan, display: "inline-flex", alignItems: "center", gap: 6 }} disabled={pengaturanMenyimpanJam}><Save size={14} />{pengaturanMenyimpanJam ? "Menyimpan…" : "Simpan Aturan Absensi & Gaji"}</button></div>\n                        </div>\n                        ''' + anchor
          settings = settings.replace(anchor, deduction, 1)

          # Add appearance controls before the first settings subsection.
          first_setting = '                        <div>\n                          <p style={{ margin: "0 0 8px", fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>Jam Masuk Standar</p>'
          appearance = '''                        <div>\n                          <p style={{ margin: "0 0 8px", fontSize: 11, fontWeight: 800, color: warna.tintaSamar, letterSpacing: "0.06em", textTransform: "uppercase" }}>Tampilan Admin</p>\n                          <div style={{ display: "grid", gap: 12 }}>\n                            <div><label style={styles.labelForm}>Kepadatan tabel</label><div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 7 }}><button type="button" onClick={() => setTampilanPadat(false)} style={{ ...styles.tombolEditKecil, fontWeight: tampilanPadat ? 600 : 800, borderColor: tampilanPadat ? warna.garis : warna.aksen }}>Nyaman</button><button type="button" onClick={() => setTampilanPadat(true)} style={{ ...styles.tombolEditKecil, fontWeight: tampilanPadat ? 800 : 600, borderColor: tampilanPadat ? warna.aksen : warna.garis }}>Padat</button></div></div>\n                            <div><label style={styles.labelForm}>Refresh dashboard otomatis</label><select value={intervalRefresh} onChange={(e) => setIntervalRefresh(Number(e.target.value))} style={{ ...styles.selectForm, maxWidth: 220, marginTop: 7 }}><option value={15}>Setiap 15 detik</option><option value={30}>Setiap 30 detik</option><option value={60}>Setiap 60 detik</option></select></div>\n                          </div>\n                        </div>\n                        ''' + first_setting
          settings = settings.replace(first_setting, appearance, 1)

          # Dedicated settings tab renders the full settings section.
          settings = settings.replace('onClick={() => void bukaPengaturanCepat()}', 'onClick={() => void bukaPengaturanCepat()}', 1)
          settings = settings.replace('<span style={{ color: warna.tintaSamar, fontSize: 12 }}>{pengaturanTerbuka ? "Tutup" : "Atur jam & lokasi"}</span>', '<span style={{ color: warna.tintaSamar, fontSize: 12 }}>{pengaturanTerbuka ? "Tutup" : "Kelola sistem"}</span>', 1)
          settings = settings.replace('<section style={{ marginTop: 18, border:', '<section style={{ marginTop: 0, border:', 1)

          marker2 = '\n          {tab === "approval" && ('
          dedicated = '\n          {tab === "pengaturan" && (\n            <section style={{ display: "grid", gap: 16 }}>\n' + settings + '\n            </section>\n          )}\n'
          if marker2 not in s:
            raise SystemExit('approval marker not found')
          s = s.replace(marker2, dedicated + marker2, 1)

          # Hide the old settings-specific helper state from accidental use in Rekap by keeping only the dedicated tab.
          # Remove old injected DOM override script from index.html so React is the single source of truth.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'\n    <script>\n      \(\(\) => \{\n        let apiBase = [\s\S]*?\n    </script>\n    <script type="module" src="/src/main.jsx"></script>', '\n    <script type="module" src="/src/main.jsx"></script>', html, count=1)
          index.write_text(html, encoding='utf-8')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx index.html
          if git diff --cached --quiet; then echo "No source changes"; exit 0; fi
          git commit -m "fix: finalize admin settings and address-only location editor"
          git push
