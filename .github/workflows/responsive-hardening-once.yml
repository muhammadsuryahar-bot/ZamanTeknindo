name: Responsive hardening once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[responsive-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Transform source safely
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s: return
              if old not in s: raise SystemExit(f'Target missing: {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          repl('src/pages/PengajuanIzin.jsx',
               '  useEffect(() => {\n    const refresh = () => {\n      if (document.visibilityState === "visible") void ambilRiwayat();\n    };',
               '  useEffect(() => {\n    const refresh = () => {\n      if (document.visibilityState === "visible") void ambilRiwayat({ silent: true });\n    };')
          repl('src/pages/PengajuanIzin.jsx',
               '  async function ambilRiwayat() {\n    setLoadingRiwayat(true); setErrorRiwayat("");',
               '  async function ambilRiwayat({ silent = false } = {}) {\n    if (!silent) setLoadingRiwayat(true); if (!silent) setErrorRiwayat("");')
          repl('src/pages/PengajuanIzin.jsx',
               '    } catch (err) { console.error(err); setRiwayat([]); setErrorRiwayat(err?.message || "Gagal memuat riwayat pengajuan."); }\n    finally { setLoadingRiwayat(false); }',
               '    } catch (err) { console.error(err); if (!silent) { setRiwayat([]); setErrorRiwayat(err?.message || "Gagal memuat riwayat pengajuan."); } }\n    finally { if (!silent) setLoadingRiwayat(false); }')

          repl('src/pages/RiwayatAbsensi.jsx',
               '  useEffect(() => {\n    const refresh = () => {\n      if (document.visibilityState === "visible") void muatRiwayat();\n    };',
               '  useEffect(() => {\n    const refresh = () => {\n      if (document.visibilityState === "visible") void muatRiwayat({ silent: true });\n    };')
          repl('src/pages/RiwayatAbsensi.jsx',
               '  async function muatRiwayat() {\n    setLoading(true);\n    setPesan("");',
               '  async function muatRiwayat({ silent = false } = {}) {\n    if (!silent) setLoading(true);\n    if (!silent) setPesan("");')
          repl('src/pages/RiwayatAbsensi.jsx',
               '    } catch (err) {\n      console.error(err);\n      setRiwayat([]);\n      setPesan(err?.message || "Gagal memuat riwayat. Cek koneksi ke server.");\n    } finally {\n      setLoading(false);\n    }',
               '    } catch (err) {\n      console.error(err);\n      if (!silent) { setRiwayat([]); setPesan(err?.message || "Gagal memuat riwayat. Cek koneksi ke server."); }\n    } finally {\n      if (!silent) setLoading(false);\n    }')

          repl('src/pages/DashboardKaryawan.jsx',
               '    if (!lokasi?.latitude || !lokasi?.longitude || !Number.isFinite(Number(lokasi?.akurasi))) {',
               '    if (!Number.isFinite(Number(lokasi?.latitude)) || !Number.isFinite(Number(lokasi?.longitude)) || !Number.isFinite(Number(lokasi?.akurasi))) {')

          repl('src/pages/DashboardAdmin.jsx',
               '      void muatNotifikasi();\n    };',
               '      void muatNotifikasi();\n      if (tab === "karyawan") void muatKaryawan(true, { silent: true });\n      if (tab === "kantor") void muatKantor(true, { silent: true });\n    };')

          repl('src/pages/DashboardAdmin.jsx',
               '  async function muatKaryawan(force = false) {\n    if (karyawanSudahDimuat && !force) return;',
               '  async function muatKaryawan(force = false, { silent = false } = {}) {\n    if (karyawanSudahDimuat && !force) return;')
          repl('src/pages/DashboardAdmin.jsx',
               '    setLoadingKaryawan(true);',
               '    if (!silent) setLoadingKaryawan(true);')
          repl('src/pages/DashboardAdmin.jsx',
               '      setPesan(err?.message || "Gagal memuat data karyawan.");\n    } finally {\n      setLoadingKaryawan(false);',
               '      if (!silent) setPesan(err?.message || "Gagal memuat data karyawan.");\n    } finally {\n      if (!silent) setLoadingKaryawan(false);')

          repl('src/pages/DashboardAdmin.jsx',
               '  async function muatKantor(force = false) {\n    if (kantorSudahDimuat && !force) return;',
               '  async function muatKantor(force = false, { silent = false } = {}) {\n    if (kantorSudahDimuat && !force) return;')
          repl('src/pages/DashboardAdmin.jsx',
               '    setLoadingKantor(true);',
               '    if (!silent) setLoadingKantor(true);')
          repl('src/pages/DashboardAdmin.jsx',
               '      setPesan(err?.message || "Gagal memuat data kantor.");\n    } finally {\n      setLoadingKantor(false);',
               '      if (!silent) setPesan(err?.message || "Gagal memuat data kantor.");\n    } finally {\n      if (!silent) setLoadingKantor(false);')
          PY
      - name: Commit source hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx src/pages/DashboardKaryawan.jsx src/pages/PengajuanIzin.jsx src/pages/RiwayatAbsensi.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: responsive live refresh [responsive-hardening]"
          git push origin main
