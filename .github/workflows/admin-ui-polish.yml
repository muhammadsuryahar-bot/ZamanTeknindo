name: Admin UI polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.event.commits[0].message != 'chore: remove temporary admin ui workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply admin UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/DashboardAdmin.jsx')
          s = p.read_text(encoding='utf-8')

          # 1) Add dedicated Pengaturan tab while keeping existing tabs intact.
          s = s.replace('      "kantor",\n    ];', '      "kantor",\n      "pengaturan",\n    ];', 1)
          s = s.replace('  "kantor": Building2,\n};', '  "kantor": Building2,\n  "pengaturan": Settings,\n};', 1)
          s = s.replace('      kantor: tabAwal === "kantor",\n    };', '      kantor: tabAwal === "kantor",\n      pengaturan: tabAwal === "pengaturan",\n    };', 1)
          s = s.replace('    { id: "kantor", label: "Kantor Pusat" },\n  ];', '    { id: "kantor", label: "Kantor Pusat" },\n    { id: "pengaturan", label: "Pengaturan" },\n  ];', 1)
          s = s.replace('{ label: "SYSTEM", idTab: ["kantor"] },', '{ label: "SYSTEM", idTab: ["kantor", "pengaturan"] },', 1)

          # 2) Dedicated settings tab should open its controls immediately.
          s = s.replace('    setSidebarMobileTerbuka(false);\n  }', '    if (idTab === "pengaturan") setPengaturanTerbuka(true);\n    setSidebarMobileTerbuka(false);\n  }', 1)

          # 3) Move the existing Pengaturan Sistem card out of Rekap Hari Ini.
          marker = '              <section style={{ marginTop: 18, border: `1px solid ${warna.garis}`, borderRadius: 14, background: warna.panel, overflow: "hidden" }}>'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('Pengaturan Sistem section tidak ditemukan')
          depth = 0
          i = start
          end = None
          token_open = '<section'
          token_close = '</section>'
          while i < len(s):
              a = s.find(token_open, i)
              b = s.find(token_close, i)
              if b == -1:
                  break
              if a != -1 and a < b:
                  depth += 1
                  i = a + len(token_open)
              else:
                  depth -= 1
                  i = b + len(token_close)
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit('Penutup Pengaturan Sistem tidak ditemukan')
          settings_section = s[start:end]
          s = s[:start] + s[end:]
          settings_section = settings_section.replace('style={{ marginTop: 18,', 'style={{ marginTop: 0,', 1)

          # 4) Insert the same tested settings controls under a dedicated tab.
          anchor = re.search(r'\n\s*\{tab === "approval" && \(', s)
          if not anchor:
              raise SystemExit('Anchor tab approval tidak ditemukan')
          insertion = '\n      {tab === "pengaturan" && (\n        <div style={{ display: "grid", gap: 18 }}>\n          <div style={{ padding: "18px 20px", border: `1px solid ${warna.garis}`, borderRadius: 16, background: warna.panel }}>\n            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>\n              <div style={{ width: 38, height: 38, borderRadius: 12, display: "grid", placeItems: "center", background: warna.aksenLembut, color: warna.aksen }}><Settings size={19} /></div>\n              <div><h2 style={{ margin: 0, fontSize: 17, color: warna.tinta }}>Pengaturan Sistem</h2><p style={{ margin: "4px 0 0", fontSize: 12, color: warna.tintaSamar }}>Atur jam masuk, potongan gaji, dan lokasi kantor dari satu tempat.</p></div>\n            </div>\n          </div>\n          ' + settings_section + '\n        </div>\n      )}\n'
          s = s[:anchor.start()] + insertion + s[anchor.start():]

          # 5) Replace browser prompt() location editor with an in-app modal.
          state_anchor = '  const [formEditStatus, setFormEditStatus] = useState({\n    statusFinal: "",\n    catatanAdmin: "",\n  });\n'
          if state_anchor not in s:
              raise SystemExit('State edit status tidak ditemukan')
          location_state = '''\n  // Modal edit lokasi absensi — menggantikan prompt() browser agar konsisten dengan UI aplikasi.\n  const [editLokasiTerbuka, setEditLokasiTerbuka] = useState(null);\n  const [formEditLokasi, setFormEditLokasi] = useState({\n    latitudeMasuk: "",\n    longitudeMasuk: "",\n    alamatMasuk: "",\n    alasan: "",\n  });\n  const [sedangSimpanLokasi, setSedangSimpanLokasi] = useState(false);\n'''
          s = s.replace(state_anchor, state_anchor + location_state, 1)

          pattern = re.compile(r'  async function editLokasiDenganDialog\(item\) \{.*?\n  \}\n\n  async function', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Fungsi editLokasiDenganDialog tidak ditemukan')
          replacement = '''  function bukaEditLokasi(item) {\n    setEditLokasiTerbuka(item);\n    setFormEditLokasi({\n      latitudeMasuk: item.latitudeMasuk ?? "",\n      longitudeMasuk: item.longitudeMasuk ?? "",\n      alamatMasuk: item.alamatMasuk || "",\n      alasan: "",\n    });\n    setPesan("");\n    setPesanSukses("");\n  }\n\n  async function simpanEditLokasi() {\n    if (!editLokasiTerbuka || sedangSimpanLokasi) return;\n\n    const latitude = Number(formEditLokasi.latitudeMasuk);\n    const longitude = Number(formEditLokasi.longitudeMasuk);\n    const alamat = formEditLokasi.alamatMasuk.trim();\n    const alasan = formEditLokasi.alasan.trim();\n\n    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90) {\n      setPesan("Latitude harus berupa angka antara -90 sampai 90.");\n      return;\n    }\n    if (!Number.isFinite(longitude) || longitude < -180 || longitude > 180) {\n      setPesan("Longitude harus berupa angka antara -180 sampai 180.");\n      return;\n    }\n    if (!alamat) {\n      setPesan("Alamat lokasi wajib diisi.");\n      return;\n    }\n    if (!alasan) {\n      setPesan("Alasan perubahan wajib diisi agar perubahan data dapat dilacak secara administratif.");\n      return;\n    }\n\n    setSedangSimpanLokasi(true);\n    setPesan("");\n    try {\n      const res = await fetch(`${API_URL}/admin/absensi/${editLokasiTerbuka.id}/edit-lokasi`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify({ latitude, longitude, alamat, alasan }),\n      });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok) throw new Error(data?.pesan || "Gagal memperbarui lokasi absensi.");\n\n      setRekap((lama) => lama.map((item) => item.id === editLokasiTerbuka.id ? { ...item, latitudeMasuk: latitude, longitudeMasuk: longitude, alamatMasuk: alamat } : item));\n      setEditLokasiTerbuka(null);\n      setPesanSukses(data?.pesan || "Lokasi absensi berhasil diperbarui.");\n    } catch (err) {\n      console.error("Gagal menyimpan lokasi absensi:", err);\n      setPesan(err?.message || "Tidak bisa menyimpan perubahan lokasi.");\n    } finally {\n      setSedangSimpanLokasi(false);\n    }\n  }\n\n  async function'''
          s = s[:m.start()] + replacement + s[m.end()-len('  async function'):]

          # 6) Update the row action to open the in-app modal.
          s = s.replace('onClick={() => void editLokasiDenganDialog(item)}', 'onClick={() => bukaEditLokasi(item)}')

          # 7) Close location modal whenever changing tabs.
          s = s.replace('    setEditStatusTerbuka(null);\n    setResetPasswordHasil(null);', '    setEditStatusTerbuka(null);\n    setEditLokasiTerbuka(null);\n    setResetPasswordHasil(null);', 1)

          # 8) Add modal before the outer shell closes.
          modal = '''\n      {editLokasiTerbuka && (\n        <div style={styles.modalBackdrop} role="presentation" onMouseDown={(e) => { if (e.target === e.currentTarget) setEditLokasiTerbuka(null); }}>\n          <div style={styles.modalCard} role="dialog" aria-modal="true" aria-labelledby="edit-lokasi-title">\n            <div style={styles.modalHeader}>\n              <div>\n                <p style={styles.modalEyebrow}>REKAP ABSENSI</p>\n                <h2 id="edit-lokasi-title" style={styles.modalTitle}>Edit Lokasi Masuk</h2>\n                <p style={styles.modalSubTitle}>{editLokasiTerbuka.pengguna?.nama || "Karyawan"}</p>\n              </div>\n              <button type="button" onClick={() => setEditLokasiTerbuka(null)} style={styles.modalClose} aria-label="Tutup">\n                <X size={18} />\n              </button>\n            </div>\n\n            <div style={styles.modalBody}>\n              <div style={styles.formGridTwo}>\n                <label style={styles.formField}>\n                  <span>Latitude</span>\n                  <input value={formEditLokasi.latitudeMasuk} onChange={(e) => setFormEditLokasi((lama) => ({ ...lama, latitudeMasuk: e.target.value }))} inputMode="decimal" style={styles.inputModal} />\n                </label>\n                <label style={styles.formField}>\n                  <span>Longitude</span>\n                  <input value={formEditLokasi.longitudeMasuk} onChange={(e) => setFormEditLokasi((lama) => ({ ...lama, longitudeMasuk: e.target.value }))} inputMode="decimal" style={styles.inputModal} />\n                </label>\n              </div>\n              <label style={styles.formField}>\n                <span>Alamat lokasi</span>\n                <textarea value={formEditLokasi.alamatMasuk} onChange={(e) => setFormEditLokasi((lama) => ({ ...lama, alamatMasuk: e.target.value }))} rows={3} maxLength={500} style={{ ...styles.inputModal, resize: "vertical", minHeight: 82 }} />\n              </label>\n              <label style={styles.formField}>\n                <span>Alasan perubahan</span>\n                <textarea value={formEditLokasi.alasan} onChange={(e) => setFormEditLokasi((lama) => ({ ...lama, alasan: e.target.value }))} rows={3} maxLength={500} placeholder="Contoh: Koordinat GPS karyawan tidak akurat saat absensi." style={{ ...styles.inputModal, resize: "vertical", minHeight: 82 }} />\n              </label>\n              <div style={styles.modalHint}><Info size={15} /> Perubahan ini hanya memperbarui lokasi masuk pada record absensi yang dipilih.</div>\n            </div>\n\n            <div style={styles.modalFooter}>\n              <button type="button" onClick={() => setEditLokasiTerbuka(null)} disabled={sedangSimpanLokasi} style={styles.tombolSekunder}>Batal</button>\n              <button type="button" onClick={() => void simpanEditLokasi()} disabled={sedangSimpanLokasi} style={styles.tombolPrimer}>\n                {sedangSimpanLokasi ? "Menyimpan…" : "Simpan Perubahan"}\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n'''
          final_anchor = '    </div>\n  );\n}\n\nconst styles ='
          if final_anchor not in s:
              raise SystemExit('Anchor penutup komponen tidak ditemukan')
          s = s.replace(final_anchor, modal + '\n' + final_anchor, 1)

          # 9) Add modal styles without touching existing design tokens.
          style_anchor = '  shell: {'
          style_add = '''  modalBackdrop: { position: "fixed", inset: 0, zIndex: 1000, background: "rgba(15,23,42,0.58)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 },\n  modalCard: { width: "min(100%, 640px)", maxHeight: "calc(100vh - 40px)", overflow: "auto", background: warna.panel, border: `1px solid ${warna.garis}`, borderRadius: 18, boxShadow: "0 24px 70px rgba(15,23,42,0.22)" },\n  modalHeader: { padding: "18px 20px", display: "flex", justifyContent: "space-between", gap: 16, alignItems: "flex-start", borderBottom: `1px solid ${warna.garis}` },\n  modalEyebrow: { margin: 0, fontSize: 10, fontWeight: 800, letterSpacing: 0.8, color: warna.aksen },\n  modalTitle: { margin: "4px 0 0", fontSize: 18, color: warna.tinta },\n  modalSubTitle: { margin: "4px 0 0", fontSize: 12, color: warna.tintaSamar },\n  modalClose: { width: 34, height: 34, borderRadius: 10, border: `1px solid ${warna.garis}`, background: "transparent", color: warna.tintaSamar, display: "grid", placeItems: "center", cursor: "pointer" },\n  modalBody: { padding: 20, display: "grid", gap: 14 },\n  formGridTwo: { display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 12 },\n  formField: { display: "grid", gap: 7, fontSize: 12, fontWeight: 700, color: warna.tinta },\n  inputModal: { width: "100%", boxSizing: "border-box", border: `1px solid ${warna.garis}`, borderRadius: 10, background: warna.panelAlt, color: warna.tinta, padding: "10px 11px", fontSize: 13, outline: "none" },\n  modalHint: { display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 12px", borderRadius: 10, background: warna.aksenLembut, color: warna.tintaLembut, fontSize: 11, lineHeight: 1.5 },\n  modalFooter: { padding: "14px 20px 20px", display: "flex", justifyContent: "flex-end", gap: 10, borderTop: `1px solid ${warna.garis}` },\n  tombolPrimer: { border: 0, borderRadius: 10, background: warna.aksen, color: "#fff", padding: "10px 14px", fontWeight: 800, fontSize: 12, cursor: "pointer" },\n  tombolSekunder: { border: `1px solid ${warna.garis}`, borderRadius: 10, background: warna.panelAlt, color: warna.tinta, padding: "10px 14px", fontWeight: 700, fontSize: 12, cursor: "pointer" },\n'''
          if style_anchor not in s:
              raise SystemExit('Style anchor tidak ditemukan')
          s = s.replace(style_anchor, style_add + style_anchor, 1)

          p.write_text(s, encoding='utf-8')
          print('DashboardAdmin.jsx updated:', len(s), 'chars')

      - name: Validate build
        run: npm ci && npm run build

      - name: Commit UI changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx .github/workflows/admin-ui-polish.yml
          git rm -f .github/workflows/admin-ui-polish.yml
          git commit -m "fix: make admin location editor and system settings consistent"
          git push origin main
