name: Fix settings click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip-settings-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix settings script
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('          if (!section || extraSettingsSiap || section.querySelector(\'[data-zaman-extra-settings="true"]\')) return;', '          if (!section || section.querySelector(\'[data-zaman-extra-settings="true"]\')) return;')
          text = text.replace('            extraSettingsSiap = true;\n', '')
          text = text.replace('            terapkanModePengaturan?.();\n', '            tampilkanSectionNormal();\n')
          path.write_text(text, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-settings-click.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-settings-click.yml
          git commit -m "fix: stabilize admin settings menu [skip-settings-fix]"
          git push
