name: Gaji massal UI maintenance (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[gaji-massal-ui-applied]') && !contains(github.event.head_commit.message, '[gaji-massal-ui-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply local refresh behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminGajiMassal.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''  async function muatDaftarGaji() {\n    setLoading(true);\n    setPesan("");'''
          new = '''  async function muatDaftarGaji({ silent = false } = {}) {\n    if (!silent) setLoading(true);\n    if (!silent) setPesan("");'''
          if s.count(old) != 1:
              raise SystemExit(f'muatDaftarGaji header expected 1, got {s.count(old)}')
          s = s.replace(old, new)
          old2 = '''      setHasilPreview(null);\n      await muatDaftarGaji();'''
          new2 = '''      setHasilPreview(null);\n      void muatDaftarGaji({ silent: true });'''
          if s.count(old2) != 1:
              raise SystemExit(f'simpanSemua refresh expected 1, got {s.count(old2)}')
          s = s.replace(old2, new2)
          # A silent refresh must not clear an existing success message and must
          # never replace the visible table with a global loading state.
          p.write_text(s, encoding='utf-8')
          print('Gaji massal local refresh fix applied.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminGajiMassal.jsx
          git commit -m "fix: keep gaji massal table stable after save [gaji-massal-ui-applied]"
          git push origin main
