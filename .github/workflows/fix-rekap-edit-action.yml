name: Fix Rekap Edit Lokasi Action

on:
  push:
    paths:
      - ".github/fix-rekap-edit-action.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Edit Lokasi row binding and action alignment
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = """          const nama = cells[0]?.textContent?.trim() || '';\n"""
          new = """          const nama = row.querySelector('td:first-child strong')?.textContent?.trim() || cells[0]?.textContent?.trim() || '';\n"""
          if text.count(old) != 1:
              raise SystemExit(f"nama binding: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new)

          old = """          const cell = document.createElement('td');\n          cell.style.textAlign = 'center';\n          cell.style.verticalAlign = 'middle';\n"""
          new = """          const cell = document.createElement('td');\n          cell.style.width = '130px';\n          cell.style.minWidth = '130px';\n          cell.style.padding = '8px 10px';\n          cell.style.textAlign = 'center';\n          cell.style.verticalAlign = 'middle';\n"""
          if text.count(old) != 1:
              raise SystemExit(f"action cell: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new)

          old = """          button.dataset.zamanLocationAction = 'true';\n          button.textContent = 'Edit Lokasi';\n"""
          new = """          button.dataset.zamanLocationAction = 'true';\n          button.textContent = 'Edit Lokasi';\n          button.style.width = '100%';\n          button.style.minHeight = '34px';\n          button.style.padding = '7px 10px';\n          button.style.border = '1px solid #D0D5DD';\n          button.style.borderRadius = '8px';\n          button.style.background = '#FFFFFF';\n          button.style.color = '#16233D';\n          button.style.fontSize = '11px';\n          button.style.fontWeight = '750';\n          button.style.cursor = 'pointer';\n"""
          if text.count(old) != 1:
              raise SystemExit(f"action button: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new)

          old = """              th.dataset.zamanActionHead = 'true';\n              th.textContent = 'Aksi';\n              theadRow.appendChild(th);\n"""
          new = """              th.dataset.zamanActionHead = 'true';\n              th.textContent = 'Aksi';\n              th.style.width = '130px';\n              th.style.minWidth = '130px';\n              th.style.textAlign = 'center';\n              th.style.verticalAlign = 'middle';\n              theadRow.appendChild(th);\n"""
          if text.count(old) != 1:
              raise SystemExit(f"action header: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          print("Rekap Edit Lokasi binding and alignment fixed.")

      - name: Commit repaired file and remove temporary repair files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-rekap-edit-action.yml .github/fix-rekap-edit-action.trigger
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: bind rekap edit lokasi to correct attendance row"
          git push
