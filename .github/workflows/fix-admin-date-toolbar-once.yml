name: Fix admin date toolbar (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[admin-date-toolbar-applied]') && !contains(github.event.head_commit.message, '[admin-date-toolbar-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply date selector and scroll behavior fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # DashboardAdmin must use the selected admin rekap date for the main table.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              'export default function DashboardAdmin({ pengguna, onLogout }) {',
              'export default function DashboardAdmin({ pengguna, onLogout, tanggalRekap }) {',
              'DashboardAdmin props',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '        fetch(`${API_URL}/admin/rekap-hari-ini`, { headers }),',
              '        fetch(\n          tanggalRekap\n            ? `${API_URL}/admin/rekap-tanggal?tanggal=${encodeURIComponent(tanggalRekap)}`\n            : `${API_URL}/admin/rekap-hari-ini`,\n          { headers },\n        ),',
              'DashboardAdmin selected date endpoint',
          )

          # AdminShell passes the selected date down to the dashboard.
          replace_once(
              'src/App.jsx',
              '      <DashboardAdmin key={`${tanggalRekap}-${refreshKey}`} pengguna={pengguna} onLogout={onLogout} />',
              '      <DashboardAdmin\n        key={`${tanggalRekap}-${refreshKey}`}\n        pengguna={pengguna}\n        onLogout={onLogout}\n        tanggalRekap={tanggalRekap}\n      />',
              'AdminShell date prop',
          )

          # The date toolbar should never sit over table data while the admin scrolls.
          replace_once(
              'src/App.jsx',
              '  const [pesan, setPesan] = useState("");\n',
              '  const [pesan, setPesan] = useState("");\n  const [rekapToolbarTerlihat, setRekapToolbarTerlihat] = useState(true);\n',
              'AdminContextBar toolbar state',
          )
          marker = '  useEffect(() => {\n    if (tab !== "rekap") return;\n    setPanelTerbuka(false);\n    setEditId(null);\n    setPesan("");\n  }, [tab, tanggal]);\n'
          addition = marker + '''\n  // Toolbar tanggal hanya tampil di bagian atas halaman Rekap.\n  // Saat tabel discroll, toolbar disembunyikan agar tidak pernah menutupi\n  // baris absensi. Kembali ke atas => toolbar muncul lagi.\n  useEffect(() => {\n    if (tab !== "rekap") return;\n\n    const target = document.querySelector(".main-area-admin");\n    if (!target) return;\n\n    const ketikaScroll = () => {\n      const diAtas = target.scrollTop <= 80;\n      setRekapToolbarTerlihat(diAtas);\n      if (!diAtas) setPanelTerbuka(false);\n    };\n\n    ketikaScroll();\n    target.addEventListener("scroll", ketikaScroll, { passive: true });\n    return () => target.removeEventListener("scroll", ketikaScroll);\n  }, [tab]);\n'''
          replace_once('src/App.jsx', marker, addition, 'AdminContextBar scroll effect')
          replace_once(
              'src/App.jsx',
              '<div className="admin-rekap-toolbar" style={styles.adminRekapToolbar}>',
              '<div\n          className="admin-rekap-toolbar"\n          style={{\n            ...styles.adminRekapToolbar,\n            opacity: rekapToolbarTerlihat ? 1 : 0,\n            visibility: rekapToolbarTerlihat ? "visible" : "hidden",\n            pointerEvents: rekapToolbarTerlihat ? "auto" : "none",\n            transform: rekapToolbarTerlihat ? "translateY(0)" : "translateY(-12px)",\n          }}\n        >',
              'AdminContextBar toolbar visibility',
          )
          replace_once(
              'src/App.jsx',
              '  adminRekapToolbar: { position: "fixed", top: 88, left: "calc(232px + 28px)", right: 28, zIndex: 10002, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "7px 9px", border: `1px solid ${warna.garis}`, borderRadius: 12, background: "rgba(255,255,255,0.98)", boxShadow: "0 10px 28px rgba(22,35,61,0.10)", backdropFilter: "blur(12px)", boxSizing: "border-box" },',
              '  adminRekapToolbar: { position: "fixed", top: 88, left: "calc(232px + 28px)", right: 28, zIndex: 10002, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "7px 9px", border: `1px solid ${warna.garis}`, borderRadius: 12, background: "rgba(255,255,255,0.98)", boxShadow: "0 10px 28px rgba(22,35,61,0.10)", backdropFilter: "blur(12px)", boxSizing: "border-box", transition: "opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease" },',
              'AdminContextBar toolbar transition',
          )

          print('Admin date selector fixes applied successfully.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: sync admin rekap date and keep toolbar out of data [admin-date-toolbar-applied]"
          git push origin main
