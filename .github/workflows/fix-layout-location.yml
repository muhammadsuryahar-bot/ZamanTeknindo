name: Fix Admin toolbar and location flow

on:
  push:
    paths:
      - ".github/fix-layout-location.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path("src/App.jsx")
          s = app.read_text(encoding="utf-8")
          s0 = s
          s = s.replace('<div style={styles.adminShell}>', '<div className="admin-shell" style={styles.adminShell}>', 1)
          s = s.replace('adminShell: { minHeight: "100svh", position: "relative" },', 'adminShell: { minHeight: "100svh", display: "flex", flexDirection: "column", position: "relative" },', 1)
          s = s.replace('adminRekapToolbar: { position: "fixed", top: 88, left: "calc(232px + 28px)", right: 28, zIndex: 10002,', 'adminRekapToolbar: { position: "relative", top: "auto", left: "auto", right: "auto", zIndex: 10, flexShrink: 0,', 1)
          if s == s0:
              raise SystemExit("App.jsx layout anchors did not match")
          app.write_text(s, encoding="utf-8")

          admin = Path("src/pages/DashboardAdmin.jsx")
          s = admin.read_text(encoding="utf-8")
          old_save = '''  async function simpanKantor() {
    if (!formKantor.namaKantor.trim()) { setPesan("Nama kantor wajib diisi."); return; }
    const latDiisi = String(formKantor.latitude).trim() !== "";
    const lngDiisi = String(formKantor.longitude).trim() !== "";
    if ((latDiisi && !Number.isFinite(Number(formKantor.latitude))) || (lngDiisi && !Number.isFinite(Number(formKantor.longitude)))) { setPesan("Latitude dan longitude harus berupa angka."); return; }
    if ((latDiisi && !lngDiisi) || (!latDiisi && lngDiisi)) { setPesan("Latitude dan longitude harus diisi berpasangan."); return; }
    setSimpanKantorLoading(true);
    try {
      const url = kantorEditId ? `/admin/kantor/${kantorEditId}` : "/admin/kantor";
      const data = await fetchJson(url, { method: kantorEditId ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(formKantor) });
      setSukses(data?.pesan || "Data kantor berhasil disimpan.");
      bukaFormTambahKantor();
      await muatKantor({ silent: true });
      await muatKaryawan({ force: true, silent: true });
    } catch (error) { console.error(error); setPesan(error?.message || "Gagal menyimpan data kantor."); }
    finally { setSimpanKantorLoading(false); }
  }
'''
          new_save = '''  async function geocodeAlamatKantor(alamat) {
    const teks = String(alamat || "").trim();
    if (!teks) throw new Error("Alamat kantor wajib diisi agar koordinat dapat ditentukan otomatis.");
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);
    try {
      const query = encodeURIComponent(`${teks}, Indonesia`);
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=id&q=${query}`, {
        signal: controller.signal,
        headers: { Accept: "application/json" },
      });
      if (!res.ok) throw new Error(`Lokasi alamat belum bisa ditentukan (HTTP ${res.status}).`);
      const data = await res.json();
      const hasil = Array.isArray(data) ? data[0] : null;
      const latitude = Number(hasil?.lat);
      const longitude = Number(hasil?.lon);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) throw new Error("Alamat belum berhasil ditemukan. Lengkapi nama jalan, kecamatan, kota, dan provinsi.");
      return { latitude: latitude.toFixed(7), longitude: longitude.toFixed(7) };
    } finally {
      clearTimeout(timeoutId);
    }
  }

  async function simpanKantor() {
    if (!formKantor.namaKantor.trim()) { setPesan("Nama kantor wajib diisi."); return; }
    if (!formKantor.alamat.trim()) { setPesan("Alamat kantor wajib diisi."); return; }
    setSimpanKantorLoading(true);
    setPesan("");
    try {
      const koordinat = await geocodeAlamatKantor(formKantor.alamat);
      const payload = { ...formKantor, ...koordinat };
      const url = kantorEditId ? `/admin/kantor/${kantorEditId}` : "/admin/kantor";
      const data = await fetchJson(url, {
        method: kantorEditId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      setSukses(data?.pesan || "Data kantor berhasil disimpan.");
      bukaFormTambahKantor();
      await muatKantor({ silent: true });
      await muatKaryawan({ force: true, silent: true });
    } catch (error) {
      console.error(error);
      setPesan(error?.message || "Gagal menyimpan data kantor.");
    } finally {
      setSimpanKantorLoading(false);
    }
  }
'''
          if old_save not in s:
              raise SystemExit("DashboardAdmin simpanKantor anchor did not match")
          s = s.replace(old_save, new_save, 1)

          old_manual = '<button type="button" onClick={() => void gunakanLokasiSekarang()} style={styles.smallButton}><Navigation size={14} /> Gunakan Lokasi Saat Ini</button>'
          if old_manual not in s:
              raise SystemExit("DashboardAdmin manual GPS button anchor did not match")
          s = s.replace(old_manual, '', 1)

          old_fields = '<Field label="Latitude (opsional)"><input value={formKantor.latitude} onChange={(e) => setFormKantor({ ...formKantor, latitude: e.target.value })} style={styles.input} inputMode="decimal" /></Field><Field label="Longitude (opsional)"><input value={formKantor.longitude} onChange={(e) => setFormKantor({ ...formKantor, longitude: e.target.value })} style={styles.input} inputMode="decimal" /></Field>'
          if old_fields not in s:
              raise SystemExit("DashboardAdmin coordinate fields anchor did not match")
          s = s.replace(old_fields, '<p style={styles.muted}>Koordinat lokasi ditentukan otomatis dari alamat saat disimpan. Admin tidak perlu mengisi latitude/longitude.</p>', 1)

          s = s.replace('Kelola master kantor. GPS absensi mencatat lokasi aktual karyawan; data kantor hanya menentukan Homebase organisasi.', 'Kelola master kantor. Alamat kantor digunakan untuk menentukan koordinat Homebase secara otomatis; GPS absensi tetap mencatat lokasi aktual karyawan.', 1)
          admin.write_text(s, encoding="utf-8")

          css = Path("src/index.css")
          c = css.read_text(encoding="utf-8")
          marker = "/* FIX: Admin Rekap toolbar participates in layout and never covers statistic cards. */"
          if marker not in c:
              c += "\n\n" + marker + "\n" + ".admin-shell{display:flex!important;flex-direction:column!important;min-height:100svh!important;}\n" + ".admin-shell>.admin-rekap-toolbar{position:relative!important;top:auto!important;left:auto!important;right:auto!important;width:100%!important;margin:0!important;padding:10px 14px!important;border-radius:0 0 12px 12px!important;box-shadow:0 2px 12px rgba(22,35,61,.08)!important;flex-shrink:0!important;z-index:10!important;}\n" + ".admin-rekap-toolbar+div{height:calc(100svh - 64px)!important;min-height:0!important;}\n" + "@media(max-width:899px){.admin-shell>.admin-rekap-toolbar{padding:8px 10px!important}.admin-rekap-toolbar+div{height:calc(100svh - 96px)!important}}\n" + "@media(max-width:640px){.admin-shell>.admin-rekap-toolbar{align-items:stretch!important}.admin-rekap-toolbar+div{height:calc(100svh - 112px)!important}}\n"
              css.write_text(c, encoding="utf-8")

      - name: Build before commit
        shell: bash
        run: |
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pages/DashboardAdmin.jsx src/index.css
          git commit -m "fix: stabilize admin toolbar and office location flow"
          git push

      - name: Remove repair workflow
        shell: bash
        run: |
          git rm -f .github/fix-layout-location.trigger .github/workflows/fix-layout-location.yml
          git commit -m "chore: remove temporary layout location repair"
          git push
