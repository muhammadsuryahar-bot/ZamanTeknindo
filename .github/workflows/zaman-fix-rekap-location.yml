name: Zaman Fix Rekap Location

on:
  push:
    paths:
      - ".github/fix-rekap-location.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply focused fixes
        run: python scripts/fix_rekap_location.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx src/pages/DashboardKaryawan.jsx index.html
          git diff --cached --quiet || git commit -m "fix: restore rekap edit lokasi and address geocoding"
          git push
          git restore --staged . || true
