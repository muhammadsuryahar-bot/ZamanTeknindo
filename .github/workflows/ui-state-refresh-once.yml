name: UI interaction maintenance (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ui-state-refresh-applied]') && !contains(github.event.head_commit.message, '[ui-state-refresh-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused interaction fixes
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Dashboard Admin: background refresh must follow the active tab.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '  const notifikasiRef = useRef(null);\n',
              '  const notifikasiRef = useRef(null);\n  const tabRef = useRef(tab);\n',
              'DashboardAdmin tabRef',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '  useEffect(() => {\n    muatData();\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n',
              '  useEffect(() => {\n    tabRef.current = tab;\n  }, [tab]);\n\n  useEffect(() => {\n    muatData();\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);\n',
              'DashboardAdmin tabRef effect',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '      if (tab === "karyawan") void muatKaryawan(true, { silent: true });\n      if (tab === "kantor") void muatKantor(true, { silent: true });',
              '      if (tabRef.current === "karyawan") void muatKaryawan(true, { silent: true });\n      if (tabRef.current === "kantor") void muatKantor(true, { silent: true });',
              'DashboardAdmin active tab polling',
          )

          # Dashboard Admin: save attendance status locally; never re-enter the global loading state.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '  const [editStatusTerbuka, setEditStatusTerbuka] = useState(null); // id absensi atau null\n',
              '  const [editStatusTerbuka, setEditStatusTerbuka] = useState(null); // id absensi atau null\n  const [sedangSimpanStatusId, setSedangSimpanStatusId] = useState(null);\n',
              'DashboardAdmin save state',
          )
          old = '''  async function simpanEditStatus(id) {\n    if (!formEditStatus.catatanAdmin.trim()) {\n      setPesan("Catatan wajib diisi saat mengubah status absensi.");\n      return;\n    }\n\n    setPesan("");\n\n    try {\n      const res = await fetch(`${API_URL}/admin/absensi/${id}/edit-status`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify(formEditStatus),\n      });\n\n      const data = await res.json();\n\n      if (!res.ok) {\n        setPesan(data.pesan || "Gagal mengubah status absensi.");\n        return;\n      }\n\n      setPesanSukses(data.pesan || "Status absensi berhasil diperbarui.");\n      setEditStatusTerbuka(null);\n      muatData();\n    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    }\n  }'''
          new = '''  async function simpanEditStatus(id) {\n    if (!formEditStatus.catatanAdmin.trim()) {\n      setPesan("Catatan wajib diisi saat mengubah status absensi.");\n      return;\n    }\n\n    if (sedangSimpanStatusId === id) return;\n\n    setPesan("");\n    setSedangSimpanStatusId(id);\n\n    try {\n      const res = await fetch(`${API_URL}/admin/absensi/${id}/edit-status`, {\n        method: "PUT",\n        headers: {\n          "Content-Type": "application/json",\n          Authorization: `Bearer ${getToken()}`,\n        },\n        body: JSON.stringify(formEditStatus),\n      });\n\n      const data = await res.json().catch(() => ({}));\n\n      if (!res.ok) {\n        setPesan(data.pesan || "Gagal mengubah status absensi.");\n        return;\n      }\n\n      const absensiBaru = data?.data;\n      setRekap((lama) =>\n        lama.map((item) =>\n          item.id === id\n            ? {\n                ...item,\n                ...(absensiBaru || {}),\n                pengguna: item.pengguna,\n                statusFinal: absensiBaru?.statusFinal ?? formEditStatus.statusFinal,\n                statusEfektif: absensiBaru?.statusFinal ?? formEditStatus.statusFinal,\n                catatanAdmin: absensiBaru?.catatanAdmin ?? formEditStatus.catatanAdmin.trim(),\n              }\n            : item,\n        ),\n      );\n\n      setEditStatusTerbuka(null);\n      setPesanSukses(data.pesan || "Status absensi berhasil diperbarui.");\n\n      // Badge notifikasi adalah data terpisah; refresh cukup bagian itu saja.\n      void muatNotifikasi();\n    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    } finally {\n      setSedangSimpanStatusId(null);\n    }\n  }'''
          replace_once('src/pages/DashboardAdmin.jsx', old, new, 'DashboardAdmin simpanEditStatus')

          # The photo itself may be represented by a signed URL; use the signed URL for the clickable link too.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              'href={urlFoto(item.fotoMasuk)}',
              'href={urlFoto(item.fotoMasuk, item.fotoMasukUrl)}',
              'DashboardAdmin fotoMasuk link',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              'href={urlFoto(item.fotoPulang)}',
              'href={urlFoto(item.fotoPulang, item.fotoPulangUrl)}',
              'DashboardAdmin fotoPulang link',
          )

          # Save button gets row-local progress only.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '                                          onClick={() =>\n                                            simpanEditStatus(item.id)\n                                          }\n                                          style={styles.tombolAktifkan}\n                                        >\n                                          Simpan',
              '                                          onClick={() =>\n                                            simpanEditStatus(item.id)\n                                          }\n                                          style={styles.tombolAktifkan}\n                                          disabled={sedangSimpanStatusId === item.id}\n                                        >\n                                          {sedangSimpanStatusId === item.id ? "Menyimpan…" : "Simpan"}',
              'DashboardAdmin local save button',
          )

          # Employee account actions: update only the affected list/item and notification badge.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '      await muatData();\n      await muatKaryawan(true);\n      await muatNotifikasi();',
              '      setKaryawan((lama) => lama.filter((item) => item.id !== id));\n      await muatNotifikasi();',
              'DashboardAdmin employee status local update',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '      await muatData();\n      await muatNotifikasi();',
              '      setMenunggu((lama) => lama.filter((item) => item.id !== id));\n      await muatNotifikasi();',
              'DashboardAdmin activation local update',
          )

          # Admin leave approvals: remove only the processed card, then refresh notification badge.
          replace_once(
              'src/pages/AdminIzin.jsx',
              '      setPesan(data.pesan || "Pengajuan berhasil diproses.");\n      await ambilDaftar();',
              '      setPesan(data.pesan || "Pengajuan berhasil diproses.");\n      setDaftar((lama) => lama.filter((item) => item.id !== id));\n      // Daftar di tab saat ini berubah; badge notifikasi akan disegarkan oleh DashboardAdmin.\n',
              'AdminIzin local mutation',
          )

          # Employee leave submission: do not replace the visible history with a loading state.
          replace_once(
              'src/pages/PengajuanIzin.jsx',
              '      setTanggal(""); setJenis("izin"); setKeterangan(""); setFotoSurat(null); await ambilRiwayat();',
              '      setTanggal(""); setJenis("izin"); setKeterangan(""); setFotoSurat(null); void ambilRiwayat({ silent: true });',
              'PengajuanIzin silent after save',
          )

          print('Focused interaction fixes applied successfully.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx src/pages/AdminIzin.jsx src/pages/PengajuanIzin.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: keep UI stable during saves [ui-state-refresh-applied]"
          git push origin main
