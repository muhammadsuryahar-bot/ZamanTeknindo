name: Final admin UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip-admin-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Admin UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/DashboardAdmin.jsx')
          s = path.read_text(encoding='utf-8')

          # Add the dedicated settings tab to the existing React navigation.
          s = s.replace('      "kantor",\n    ];', '      "kantor",\n      "pengaturan",\n    ];', 1)
          s = s.replace('      kantor: tabAwal === "kantor",\n', '      kantor: tabAwal === "kantor",\n      pengaturan: tabAwal === "pengaturan",\n', 1)
          s = s.replace('  kantor: Building2,\n};', '  kantor: Building2,\n  pengaturan: Settings,\n};', 1)
          s = s.replace('    { id: "kantor", label: "Kantor Pusat" },\n  ];', '    { id: "kantor", label: "Kantor Pusat" },\n    { id: "pengaturan", label: "Pengaturan" },\n  ];', 1)
          s = s.replace('{ label: "SYSTEM", idTab: ["kantor"] },', '{ label: "SYSTEM", idTab: ["kantor", "pengaturan"] },', 1)

          # Replace the native prompt() location editor with an in-app modal.
          start = s.index('  async function editLokasiDenganDialog(item) {')
          end = s.index('\n  function bukaEditStatus(item) {', start)
          new_fn = r'''  async function editLokasiDenganDialog(item) {
    const lama = document.getElementById("zaman-edit-lokasi-modal");
    if (lama) lama.remove();

    const escapeHtml = (nilai) =>
      String(nilai ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const overlay = document.createElement("div");
    overlay.id = "zaman-edit-lokasi-modal";
    Object.assign(overlay.style, {
      position: "fixed",
      inset: "0",
      zIndex: "99999",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: "16px",
      background: "rgba(15,23,42,.58)",
    });

    const box = document.createElement("div");
    Object.assign(box.style, {
      width: "100%",
      maxWidth: "560px",
      maxHeight: "calc(100vh - 32px)",
      overflowY: "auto",
      boxSizing: "border-box",
      background: "#fff",
      borderRadius: "18px",
      padding: "20px",
      boxShadow: "0 24px 70px rgba(0,0,0,.24)",
    });

    box.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px">
        <div>
          <div style="font-size:17px;font-weight:800;color:#172033">Edit Lokasi Masuk</div>
          <div style="margin-top:5px;font-size:12px;color:#667085">${escapeHtml(item?.pengguna?.nama || "Karyawan")}</div>
        </div>
        <button type="button" data-tutup="1" aria-label="Tutup" style="border:0;background:transparent;color:#667085;font-size:24px;line-height:1;cursor:pointer;padding:0 2px">×</button>
      </div>

      <label style="display:block;margin-bottom:8px;font-size:12px;font-weight:800;color:#344054">Alamat lengkap lokasi</label>
      <textarea data-alamat rows="5" maxlength="500" placeholder="Jl. Sadang Sari No.3, Sekeloa, Kecamatan Coblong, Kota Bandung, Jawa Barat 40133" style="width:100%;box-sizing:border-box;resize:vertical;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit;font-size:13px;line-height:1.5;outline:none"></textarea>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:#667085">
        <span>Koordinat GPS tetap tersimpan dan tidak perlu diinput admin.</span>
        <span data-jumlah>0/500</span>
      </div>
      <div data-pesan style="min-height:18px;margin-top:8px;font-size:12px;color:#b42318"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
        <button type="button" data-tutup="1" style="border:1px solid #d0d5dd;background:#fff;color:#344054;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer">Batal</button>
        <button type="button" data-simpan style="border:0;background:#1d4ed8;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Simpan Alamat</button>
      </div>
    `;

    const textarea = box.querySelector("[data-alamat]");
    const jumlah = box.querySelector("[data-jumlah]");
    const pesanModal = box.querySelector("[data-pesan]");
    const tombolSimpan = box.querySelector("[data-simpan]");
    textarea.value = item?.alamatMasuk || "";

    const perbaruiJumlah = () => {
      jumlah.textContent = `${textarea.value.length}/500`;
    };
    textarea.addEventListener("input", perbaruiJumlah);
    perbaruiJumlah();

    const tutup = () => {
      document.removeEventListener("keydown", tekanEscape);
      overlay.remove();
    };
    const tekanEscape = (event) => {
      if (event.key === "Escape") tutup();
    };

    box.querySelectorAll('[data-tutup="1"]').forEach((button) => {
      button.addEventListener("click", tutup);
    });
    overlay.addEventListener("mousedown", (event) => {
      if (event.target === overlay) tutup();
    });
    document.addEventListener("keydown", tekanEscape);

    tombolSimpan.addEventListener("click", async () => {
      const alamatMasuk = textarea.value.trim();
      pesanModal.textContent = "";

      if (!alamatMasuk) {
        pesanModal.textContent = "Alamat lengkap wajib diisi.";
        textarea.focus();
        return;
      }
      if (alamatMasuk.length > 500) {
        pesanModal.textContent = "Alamat maksimal 500 karakter.";
        textarea.focus();
        return;
      }

      tombolSimpan.disabled = true;
      tombolSimpan.textContent = "Menyimpan…";
      try {
        const res = await fetch(`${API_URL}/admin/absensi/${item.id}/edit-lokasi`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${getToken()}`,
          },
          body: JSON.stringify({ alamatMasuk }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.pesan || "Gagal mengubah alamat lokasi.");

        setRekap((lama) =>
          lama.map((row) =>
            row.id === item.id
              ? { ...row, ...(data?.data || {}), alamatMasuk }
              : row,
          ),
        );
        tutup();
        setPesanSukses(data?.pesan || "Alamat lokasi berhasil diperbarui.");
      } catch (error) {
        tombolSimpan.disabled = false;
        tombolSimpan.textContent = "Simpan Alamat";
        pesanModal.textContent = error?.message || "Tidak bisa terhubung ke server.";
      }
    });

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => textarea.focus(), 0);
  }
'''
          s = s[:start] + new_fn.rstrip() + s[end:]

          # Move the existing settings section out of Rekap and into its own tab.
          m = re.search(r'\n              <section[^>]*>\s*<button[^>]*>.*?Pengaturan Sistem.*?</section>\n', s, re.S)
          if not m:
            raise SystemExit('Settings section not found')
          settings = m.group(0).strip('\n')
          s = s[:m.start()] + '\n' + s[m.end():]

          marker = '\n          {tab === "approval" && ('
          if marker not in s:
            raise SystemExit('Approval marker not found')
          dedicated = f'''\n\n          {{tab === "pengaturan" && (\n            <>\n{settings}\n            </>\n          )}}\n'''
          s = s.replace(marker, dedicated + marker, 1)

          # Keep React's current form behavior intact for the rest of Admin.
          path.write_text(s, encoding='utf-8')

          # Remove the temporary workflow after applying the real source changes.
          wf = Path('.github/workflows/fix-admin-location-settings.yml')
          wf.unlink()
      - name: Commit final source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardAdmin.jsx .github/workflows/fix-admin-location-settings.yml
          git commit -m "fix: finalize admin location modal and settings menu [skip-admin-fix]"
          git push
