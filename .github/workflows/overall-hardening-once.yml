name: Overall hardening (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[overall-hardening-applied]') && !contains(github.event.head_commit.message, '[overall-hardening-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply proven audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # A) "Atur Status" must refresh only the affected rekap data, never
          # remount the complete DashboardAdmin tree.
          replace_once(
              'src/App.jsx',
              'function AdminContextBar({ tanggal, onTanggalChange }) {',
              'function AdminContextBar({ tanggal, onTanggalChange, onRekapRefresh }) {',
              'AdminContextBar props',
          )
          replace_once(
              'src/App.jsx',
              '      onTanggalChange(tanggal, true);',
              '      onRekapRefresh();',
              'Atur Status remount removal',
          )
          replace_once(
              'src/App.jsx',
              '  const [refreshKey, setRefreshKey] = useState(0);\n',
              '  const [rekapRefreshNonce, setRekapRefreshNonce] = useState(0);\n',
              'AdminShell refresh state',
          )
          replace_once(
              'src/App.jsx',
              '  function onTanggalChange(tanggalBaru, forceRefresh = false) {',
              '  function onTanggalChange(tanggalBaru) {',
              'AdminShell date handler',
          )
          replace_once(
              'src/App.jsx',
              '    setTanggalRekap(aman);\n    setRefreshKey((nilai) => nilai + 1 + (forceRefresh ? 1 : 0));',
              '    setTanggalRekap(aman);',
              'AdminShell remount removal',
          )
          replace_once(
              'src/App.jsx',
              '      {!arsipTerbuka && <AdminContextBar tanggal={tanggalRekap} onTanggalChange={onTanggalChange} />}\n      <DashboardAdmin\n        key={`${tanggalRekap}-${refreshKey}`}\n        pengguna={pengguna}\n        onLogout={onLogout}\n        tanggalRekap={tanggalRekap}\n      />',
              '      {!arsipTerbuka && <AdminContextBar tanggal={tanggalRekap} onTanggalChange={onTanggalChange} onRekapRefresh={() => setRekapRefreshNonce((nilai) => nilai + 1)} />}\n      <DashboardAdmin\n        pengguna={pengguna}\n        onLogout={onLogout}\n        tanggalRekap={tanggalRekap}\n        rekapRefreshNonce={rekapRefreshNonce}\n      />',
              'AdminShell stable dashboard',
          )

          # B) Keep the selected date across Admin polling, including after
          # changing historical dates.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              'export default function DashboardAdmin({ pengguna, onLogout, tanggalRekap }) {',
              'export default function DashboardAdmin({ pengguna, onLogout, tanggalRekap, rekapRefreshNonce }) {',
              'DashboardAdmin refresh prop',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '  useEffect(() => {\n    muatData();\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, []);',
              '  useEffect(() => {\n    void muatData();\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [tanggalRekap, rekapRefreshNonce]);',
              'DashboardAdmin data refresh effect',
          )
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '  }, []);\n\n  useEffect(() => {\n    if (tab === "karyawan") {',
              '  }, [tanggalRekap]);\n\n  useEffect(() => {\n    if (tab === "karyawan") {',
              'DashboardAdmin polling date dependency',
          )

          # C) Reactivation must increase the active count and refresh the row,
          # while deactivation removes the row and decreases the count.
          replace_once(
              'src/pages/DashboardAdmin.jsx',
              '      setKaryawan((lama) => lama.filter((item) => item.id !== id));\n      setJumlahKaryawanAktif((jumlah) => Math.max(0, jumlah - 1));\n      void muatNotifikasi();',
              '      if (statusBaru === "nonaktif") {\n        setKaryawan((lama) => lama.filter((item) => item.id !== id));\n        setJumlahKaryawanAktif((jumlah) => Math.max(0, jumlah - 1));\n      } else {\n        setJumlahKaryawanAktif((jumlah) => jumlah + 1);\n        void muatKaryawan(true, { silent: true });\n      }\n      void muatNotifikasi();',
              'Karyawan reactivation logic',
          )

          # D) Do not allow future payroll periods to be calculated/saved.
          replace_once(
              'backend/src/controllers/hitungGajiController.js',
              '  if (!Number.isInteger(bulan) || bulan < 1 || bulan > 12) {\n    const error = new Error("Bulan tidak valid. Gunakan angka 1-12.");\n    error.code = "INPUT_INVALID";\n    throw error;\n  }\n\n  return { tahun, bulan };',
              '  if (!Number.isInteger(bulan) || bulan < 1 || bulan > 12) {\n    const error = new Error("Bulan tidak valid. Gunakan angka 1-12.");\n    error.code = "INPUT_INVALID";\n    throw error;\n  }\n\n  if (tahun > sekarangWIB.tahun || (tahun === sekarangWIB.tahun && bulan > sekarangWIB.bulan)) {\n    const error = new Error("Periode gaji mendatang belum dapat dihitung atau dibuat laporannya.");\n    error.code = "INPUT_INVALID";\n    throw error;\n  }\n\n  return { tahun, bulan };',
              'Future payroll guard',
          )

          # E) Prevent duplicate clicks on salary-setting saves.
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '  const [pesan, setPesan] = useState("");\n',
              '  const [pesan, setPesan] = useState("");\n  const [sedangSimpanPotongan, setSedangSimpanPotongan] = useState(false);\n  const [sedangSimpanGajiId, setSedangSimpanGajiId] = useState(null);\n',
              'Payroll save states',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '  async function simpanPotongan(e) {\n    e.preventDefault();\n    setPesan("");\n',
              '  async function simpanPotongan(e) {\n    e.preventDefault();\n    if (sedangSimpanPotongan) return;\n    setPesan("");\n    setSedangSimpanPotongan(true);\n',
              'Payroll settings save guard',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    }\n  }\n\n  async function simpanGajiPokok(id) {',
              '    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    } finally {\n      setSedangSimpanPotongan(false);\n    }\n  }\n\n  async function simpanGajiPokok(id) {',
              'Payroll settings save finally',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '  async function simpanGajiPokok(id) {\n    const nilai = inputGaji[id];',
              '  async function simpanGajiPokok(id) {\n    if (sedangSimpanGajiId === id) return;\n    const nilai = inputGaji[id];',
              'Payroll row save guard',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '    setPesan("");\n\n    try {\n      const res = await fetch(`${API_URL}/admin/gaji/${id}/atur`, {',
              '    setPesan("");\n    setSedangSimpanGajiId(id);\n\n    try {\n      const res = await fetch(`${API_URL}/admin/gaji/${id}/atur`, {',
              'Payroll row save state',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    }\n  }\n\n  async function muatLaporanBulanan() {',
              '    } catch (err) {\n      console.error(err);\n      setPesan("Tidak bisa terhubung ke server.");\n    } finally {\n      setSedangSimpanGajiId(null);\n    }\n  }\n\n  async function muatLaporanBulanan() {',
              'Payroll row save finally',
          )
          replace_once(
              'src/pages/PengaturanGaji.jsx',
              '            type="submit"\n            style={styles.tombolUtama}\n            className="gaji-button"\n          >\n            Simpan Pengaturan\n          </button>',
              '            type="submit"\n            style={styles.tombolUtama}\n            className="gaji-button"\n            disabled={sedangSimpanPotongan}\n          >\n            {sedangSimpanPotongan ? "Menyimpan…" : "Simpan Pengaturan"}\n          </button>',
              'Payroll settings button UX',
          )

          print('Proven audited fixes applied successfully.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pages/DashboardAdmin.jsx src/pages/PengaturanGaji.jsx backend/src/controllers/hitungGajiController.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: harden audited system flows [overall-hardening-applied]"
          git push origin main
