name: Apply Attendance Location Editor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          a=root/'src/pages/DashboardAdmin.jsx'; b=root/'backend/src/controllers/rekapAbsensiFixedController.js'; r=root/'backend/src/routes/adminRoutes.js'
          admin=a.read_text(); backend=b.read_text(); routes=r.read_text()
          if 'async function ubahLokasiAbsensi' not in backend:
            marker='async function rekapHariIniFixed(req, res) {'
            fn='''async function ubahLokasiAbsensi(req, res) {\n  try {\n    const absensiId = Number(req.params.id);\n    const latitude = Number(req.body?.latitudeMasuk);\n    const longitude = Number(req.body?.longitudeMasuk);\n    const alamatMasuk = String(req.body?.alamatMasuk || "").trim();\n    if (!Number.isInteger(absensiId) || absensiId <= 0) return res.status(400).json({ pesan: "ID absensi tidak valid." });\n    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90) return res.status(400).json({ pesan: "Latitude tidak valid." });\n    if (!Number.isFinite(longitude) || longitude < -180 || longitude > 180) return res.status(400).json({ pesan: "Longitude tidak valid." });\n    if (!alamatMasuk) return res.status(400).json({ pesan: "Alamat lokasi wajib diisi." });\n    if (alamatMasuk.length > 500) return res.status(400).json({ pesan: "Alamat lokasi maksimal 500 karakter." });\n    const existing = await prisma.absensi.findUnique({ where: { id: absensiId }, select: { id: true } });\n    if (!existing) return res.status(404).json({ pesan: "Data absensi tidak ditemukan." });\n    const absensi = await prisma.absensi.update({ where: { id: absensiId }, data: { latitudeMasuk: latitude, longitudeMasuk: longitude, alamatMasuk } });\n    return res.json({ pesan: "Lokasi absensi berhasil diperbarui.", data: absensi });\n  } catch (error) {\n    console.error("Gagal mengubah lokasi absensi:", error);\n    return res.status(500).json({ pesan: "Terjadi kesalahan pada server." });\n  }\n}\n'''
            if marker not in backend: raise SystemExit('backend marker missing')
            backend=backend.replace(marker,fn+marker,1)
            exp='module.exports = { rekapHariIniFixed, ambilRekapTanggal, ubahStatusTanpaAbsensi };'
            if exp not in backend: raise SystemExit('backend export missing')
            backend=backend.replace(exp,'module.exports = { rekapHariIniFixed, ambilRekapTanggal, ubahStatusTanpaAbsensi, ubahLokasiAbsensi };',1)
          if 'router.put("/absensi/:id/edit-lokasi"' not in routes:
            imp='''  ambilRekapTanggal,\n  ubahStatusTanpaAbsensi,\n} = require("../controllers/rekapAbsensiFixedController");'''
            if imp not in routes: raise SystemExit('route import missing')
            routes=routes.replace(imp,'''  ambilRekapTanggal,\n  ubahStatusTanpaAbsensi,\n  ubahLokasiAbsensi,\n} = require("../controllers/rekapAbsensiFixedController");''',1)
            rm='''router.put(\n  "/absensi/tanggal/:tanggal/pengguna/:penggunaId/status",\n  validasiEditStatusAbsensi,\n  ubahStatusTanpaAbsensi,\n);'''
            if rm not in routes: raise SystemExit('route marker missing')
            routes=routes.replace(rm,rm+'\nrouter.put("/absensi/:id/edit-lokasi", ubahLokasiAbsensi);',1)
          if 'editLokasiTerbuka' not in admin:
            sm='''  const [editStatusTerbuka, setEditStatusTerbuka] = useState(null);\n  const [sedangSimpanStatusId, setSedangSimpanStatusId] = useState(null);'''
            if sm not in admin: raise SystemExit('frontend state missing')
            admin=admin.replace(sm,'''  const [editStatusTerbuka, setEditStatusTerbuka] = useState(null);\n  const [sedangSimpanStatusId, setSedangSimpanStatusId] = useState(null);\n  const [editLokasiTerbuka, setEditLokasiTerbuka] = useState(null);\n  const [sedangSimpanLokasiId, setSedangSimpanLokasiId] = useState(null);\n  const [formEditLokasi, setFormEditLokasi] = useState({ latitudeMasuk: "", longitudeMasuk: "", alamatMasuk: "" });''',1)
            fm='  function bukaEditStatus(item) {'
            if fm not in admin: raise SystemExit('frontend function missing')
            fnf='''  function bukaEditLokasi(item) {\n    setEditLokasiTerbuka(item.id);\n    setEditStatusTerbuka(null);\n    setFormEditLokasi({ latitudeMasuk: item.latitudeMasuk ?? "", longitudeMasuk: item.longitudeMasuk ?? "", alamatMasuk: item.alamatMasuk && item.alamatMasuk !== "Lokasi GPS belum tersedia" ? item.alamatMasuk : "" });\n  }\n\n  function gunakanLokasiAdminUntukAbsensi() {\n    if (!navigator.geolocation) { setPesan("Browser/perangkat ini tidak menyediakan layanan lokasi."); return; }\n    setPesan("");\n    navigator.geolocation.getCurrentPosition((posisi) => {\n      const latitude=Number(posisi.coords.latitude), longitude=Number(posisi.coords.longitude);\n      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) { setPesan("Koordinat GPS Admin tidak valid. Coba lagi."); return; }\n      setFormEditLokasi((lama)=>({...lama,latitudeMasuk:latitude.toFixed(7),longitudeMasuk:longitude.toFixed(7)}));\n      setPesanSukses("Lokasi Admin berhasil diambil. Periksa alamat lalu simpan perubahan.");\n    },()=>setPesan("Lokasi Admin belum berhasil diperoleh. Pastikan GPS aktif dan izin lokasi dashboard diberikan."),{enableHighAccuracy:true,maximumAge:5000,timeout:20000});\n  }\n\n  async function simpanEditLokasi(id) {\n    const latitude=Number(formEditLokasi.latitudeMasuk), longitude=Number(formEditLokasi.longitudeMasuk), alamatMasuk=formEditLokasi.alamatMasuk.trim();\n    if (!Number.isFinite(latitude)||latitude<-90||latitude>90) return setPesan("Latitude tidak valid.");\n    if (!Number.isFinite(longitude)||longitude<-180||longitude>180) return setPesan("Longitude tidak valid.");\n    if (!alamatMasuk) return setPesan("Alamat lokasi wajib diisi.");\n    if (alamatMasuk.length>500) return setPesan("Alamat lokasi maksimal 500 karakter.");\n    if (sedangSimpanLokasiId===id) return;\n    setPesan(""); setSedangSimpanLokasiId(id);\n    try {\n      const res=await fetch(`${API_URL}/admin/absensi/${id}/edit-lokasi`,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:`Bearer ${getToken()}`},body:JSON.stringify({latitudeMasuk:latitude,longitudeMasuk:longitude,alamatMasuk})});\n      const data=await res.json().catch(()=>({}));\n      if(!res.ok){setPesan(data?.pesan||"Gagal mengubah lokasi absensi.");return;}\n      setRekap((lama)=>lama.map((item)=>item.id===id?{...item,...(data?.data||{}),latitudeMasuk:latitude,longitudeMasuk:longitude,alamatMasuk}:item));\n      setEditLokasiTerbuka(null); setPesanSukses(data?.pesan||"Lokasi absensi berhasil diperbarui.");\n    } catch(err){console.error("Gagal mengubah lokasi absensi:",err);setPesan("Tidak bisa terhubung ke server.");} finally {setSedangSimpanLokasiId(null);}\n  }\n\n'''
            admin=admin.replace(fm,fnf+fm,1)
            cm='''    setEditStatusTerbuka(null);\n    setResetPasswordHasil(null);'''
            if cm not in admin: raise SystemExit('cleanup missing')
            admin=admin.replace(cm,'''    setEditStatusTerbuka(null);\n    setEditLokasiTerbuka(null);\n    setResetPasswordHasil(null);''',1)
            am='''                                <td\n                                  style={{ ...styles.td, textAlign: "right" }}\n                                >\n                                  <button\n                                    onClick={() =>\n                                      sedangEdit\n                                        ? setEditStatusTerbuka(null)\n                                        : bukaEditStatus(item)\n                                    }\n                                    style={styles.tombolEditKecil}\n                                  >\n                                    {sedangEdit ? "Tutup" : "Ubah Status"}\n                                  </button>\n                                </td>'''
            an='''                                <td style={{ ...styles.td, textAlign: "right" }}>\n                                  <div style={{ display: "flex", gap: 6, justifyContent: "flex-end", flexWrap: "wrap" }}>\n                                    <button type="button" onClick={() => editLokasiTerbuka === item.id ? setEditLokasiTerbuka(null) : bukaEditLokasi(item)} style={styles.tombolEditKecil}>{editLokasiTerbuka === item.id ? "Tutup Lokasi" : "Edit Lokasi"}</button>\n                                    <button type="button" onClick={() => sedangEdit ? setEditStatusTerbuka(null) : bukaEditStatus(item)} style={styles.tombolEditKecil}>{sedangEdit ? "Tutup Status" : "Ubah Status"}</button>\n                                  </div>\n                                </td>'''
            if am not in admin: raise SystemExit('action marker missing')
            admin=admin.replace(am,an,1)
            im='''                              {sedangEdit && (\n                                <tr>'''
            ir='''                              {editLokasiTerbuka === item.id && (\n                                <tr>\n                                  <td colSpan={7} style={{ padding: "0 16px 16px 16px", background: warna.panelAlt }}>\n                                    <div style={styles.formInline}>\n                                      <strong style={{ fontSize: 13, color: warna.tinta }}>Edit Lokasi Absensi</strong>\n                                      <p style={{ margin: "4px 0 8px", fontSize: 11, color: warna.tintaSamar }}>Ubah lokasi MASUK yang tampil pada rekap karyawan ini.</p>\n                                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10 }}>\n                                        <div><label style={styles.labelForm}>Latitude</label><input value={formEditLokasi.latitudeMasuk} onChange={(e)=>setFormEditLokasi({...formEditLokasi,latitudeMasuk:e.target.value})} style={styles.inputForm} inputMode="decimal" /></div>\n                                        <div><label style={styles.labelForm}>Longitude</label><input value={formEditLokasi.longitudeMasuk} onChange={(e)=>setFormEditLokasi({...formEditLokasi,longitudeMasuk:e.target.value})} style={styles.inputForm} inputMode="decimal" /></div>\n                                      </div>\n                                      <label style={styles.labelForm}>Alamat / Keterangan Lokasi</label>\n                                      <textarea value={formEditLokasi.alamatMasuk} onChange={(e)=>setFormEditLokasi({...formEditLokasi,alamatMasuk:e.target.value})} placeholder="Contoh: Jalan Permadani Raya II, Binawidya, Pekanbaru, Riau" style={styles.textareaForm} maxLength={500} />\n                                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 2 }}><button type="button" onClick={gunakanLokasiAdminUntukAbsensi} style={{ ...styles.tombolEditKecil, display: "inline-flex", alignItems: "center", gap: 6 }}><Navigation size={14}/>Gunakan Lokasi Admin</button></div>\n                                      <div style={styles.formTombolGroup}><button type="button" onClick={()=>setEditLokasiTerbuka(null)} style={styles.tombolBatal}>Batal</button><button type="button" onClick={()=>void simpanEditLokasi(item.id)} style={styles.tombolAktifkan} disabled={sedangSimpanLokasiId===item.id}>{sedangSimpanLokasiId===item.id?"Menyimpan…":"Simpan Lokasi"}</button></div>\n                                    </div>\n                                  </td>\n                                </tr>\n                              )}\n\n''' + im
            if im not in admin: raise SystemExit('editor marker missing')
            admin=admin.replace(im,ir,1)
          a.write_text(admin); b.write_text(backend); r.write_text(routes)
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/DashboardAdmin.jsx backend/src/controllers/rekapAbsensiFixedController.js backend/src/routes/adminRoutes.js .github/workflows/apply-attendance-location-editor.yml
          git diff --cached --check
          git commit -m 'fix: add attendance location editor for admin rekap'
          git rm .github/workflows/apply-attendance-location-editor.yml
          git commit --amend --no-edit
          git push origin main
