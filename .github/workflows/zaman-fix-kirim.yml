name: Zaman Fix Kirim Absen

on:
  push:
    paths:
      - ".github/fix-kirim.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply focused fix
        run: python scripts/fix_kirim_absen_duplicate.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardKaryawan.jsx
          git diff --cached --quiet || git commit -m "fix: remove duplicated attendance validation block"
          git push
